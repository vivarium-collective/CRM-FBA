<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-feeding in a two-species community — report</title>
<style>
:root{
  --paper:#FAF9F6; --surface:#FFFFFF; --sunken:#F4F2ED;
  --ink:#1F1D1B; --ink-2:#57534E; --ink-3:#8A857D;
  --line:#E7E4DE; --line-2:#D8D4CC;
  --accent:#0F766B; --accent-soft:#0F766B22;
  --pass:#1A7F5A; --fail:#B42318; --warn:#A16207; --cal:#0E7490;
  --pass-soft:#1A7F5A18; --fail-soft:#B4231814; --warn-soft:#A1620714;
  --chip:#F1EFEA;
  --shadow:0 1px 2px rgba(30,25,20,.04),0 1px 0 var(--line);
  --serif:"Iowan Old Style","Palatino Nova",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}}
:root[data-theme="dark"]{
  --paper:#161513; --surface:#1E1C19; --sunken:#232019;
  --ink:#EDEAE3; --ink-2:#A8A29B; --ink-3:#78736B;
  --line:#37332D; --line-2:#453F37;
  --accent:#3FB9A5; --accent-soft:#3FB9A526;
  --pass:#43C08D; --fail:#E5675C; --warn:#D9A036; --cal:#4CC3E0;
  --pass-soft:#43C08D1f; --fail-soft:#E5675C1c; --warn-soft:#D9A0361c;
  --chip:#2A2723;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 0 var(--line);
}
/* Print / PDF: pure-white background for easy printing. Force light inks too so
   a report printed from dark mode still shows dark text on white. page.pdf()
   emulates print media, so this governs the server-side PDF export as well. */
@media print{
  :root,:root[data-theme="dark"],:root[data-theme="light"]{
    --paper:#fff; --surface:#fff; --sunken:#fff; --chip:#f2f2f0;
    --ink:#1a1a1a; --ink-2:#444; --ink-3:#777;
    --line:#e4e4e2; --line-2:#cfcfcc; --accent:#0F766B; --shadow:none;
  }
  html,body{background:#fff !important;}
  /* Nav + overlay chrome is screen-only; Chromium paints position:fixed elements
     on EVERY printed page, so these must be removed or they ghost onto the PDF. */
  .topbar,.subnav,.fbfloat,#report-feedback,.navdrawer,.navdrawer-backdrop,.modal-bg{display:none !important;}
  [onclick*="toggleEditor"],.fbbubble{display:none !important;}
  /* No scroll frames in print — overflow:auto containers render a scrollbar
     gutter/corner as a gray box; let their content lay out naturally. */
  .wdag-shell{overflow:visible !important;background:#fff !important;max-height:none !important;}
  /* Figures: keep each figure + its caption together on one page (no mid-figure
     page breaks), and never let a figure spill past the page width. The Plotly
     figures are additionally re-fit to the page width in __reportPrintPrep. */
  figure.main-fig,figure.embedded-viz,.main-fig{break-inside:avoid;page-break-inside:avoid}
  figure figcaption,.main-fig figcaption{break-inside:avoid}
  .plotly-holder{overflow:visible !important}
  .main-fig img,.viz-frame,.plotly-holder,.plotly-holder>div{max-width:100% !important}
  h2,h3{break-after:avoid}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;scroll-padding-top:64px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1440px;margin:0 auto;padding:0 40px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.9em}
.serif{font-family:var(--serif)}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:56px}
.brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.switch{display:flex;gap:4px;margin-left:auto;background:var(--sunken);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.switch button{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2);
  background:none;border:none;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch-label{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.switch-label+.switch{margin-left:10px}
.themebtn{background:none;border:1px solid var(--line);color:var(--ink-2);width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}

/* ---- masthead ---- */
.masthead{padding:44px 0 8px}
.masthead .eyebrow{color:var(--ink-3);font-size:12.5px;letter-spacing:.04em;margin-bottom:10px}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;margin:0;
  letter-spacing:-.01em;text-wrap:balance;max-width:28ch}
.provline{color:var(--ink-3);font-size:13px;margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.provline .sep{opacity:.5}

/* ---- verdict banner ---- */
.verdict{margin:28px 0 8px;padding:24px 26px 24px 30px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--pass);border-radius:12px;box-shadow:var(--shadow)}
.verdict.is-fail{border-left-color:var(--fail)}
.verdict.is-progress{border-left-color:var(--warn)}
.verdict .vhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.verdict .vtext{font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--ink);margin:0;max-width:none}
.verdict .what{color:var(--ink-2);font-size:14.5px;margin-top:14px;max-width:none}

/* status chip */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:4px 11px;border-radius:999px;text-transform:uppercase}
.status.pass{color:var(--pass);background:var(--pass-soft)}
.status.fail{color:var(--fail);background:var(--fail-soft)}
.status.warn{color:var(--warn);background:var(--warn-soft)}
.status .g{width:7px;height:7px;border-radius:999px;background:currentColor}

/* ---- stat strip ---- */
.stats{display:flex;flex-wrap:wrap;gap:0;margin:22px 0;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);overflow:hidden}
.stats .stat{flex:1;min-width:120px;padding:16px 18px;border-right:1px solid var(--line)}
.stats .stat:last-child{border-right:none}
.stats .num{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1}
.stats .lbl{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.stats .num.pass{color:var(--pass)}.stats .num.fail{color:var(--fail)}

/* ---- section headers ---- */
.sec-h{display:flex;align-items:baseline;gap:12px;margin:44px 0 16px}
.sec-h h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line)}

/* ---- glance table ---- */
.glance{width:100%;border-collapse:collapse;font-size:14px}
.glance th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line-2)}
.glance td{padding:11px 12px;border-bottom:1px solid var(--line)}
.glance tr:hover td{background:var(--sunken)}
.glance .idx{color:var(--ink-3);font-family:var(--mono);width:26px}
.glance a.st{font-weight:600;color:var(--ink)}
.glance a.st:hover{color:var(--accent);text-decoration:none}
.glance .flag{color:var(--warn);font-size:11.5px;font-weight:700;margin-left:8px}

/* ---- sticky nav ---- */
.subnav{position:sticky;top:56px;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:36px}
.subnav .wrap{display:flex;gap:4px;height:44px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{font-size:12.5px;color:var(--ink-2);padding:5px 10px;border-radius:7px;white-space:nowrap;font-weight:500}
.subnav a.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.subnav a.exec{font-weight:600}
/* Full "Contents" jump menu — reaches every part incl. the 37 supplement studies.
   The panel is position:fixed so the subnav's overflow:auto never clips it. */
.navmenu{position:relative;display:inline-flex;align-items:center;margin-right:8px;flex:0 0 auto}
.navmenu-btn{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.navmenu-btn:hover{border-color:var(--accent)}
/* Contents: a clean left slide-in drawer (replaces the old wide dropdown). */
.navdrawer-backdrop{position:fixed;inset:0;background:rgba(20,18,15,.34);z-index:85;opacity:0;pointer-events:none;transition:opacity .2s ease}
.navdrawer-backdrop.open{opacity:1;pointer-events:auto}
.navdrawer{position:fixed;top:0;left:0;height:100vh;width:min(330px,86vw);background:var(--surface);border-right:1px solid var(--line);box-shadow:0 10px 44px rgba(20,18,15,.20);z-index:90;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;overflow:hidden}
.navdrawer.open{transform:none}
.nd-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 11px;font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--ink);border-bottom:1px solid var(--line);flex:0 0 auto}
.nd-close{background:transparent;border:none;font-size:15px;color:var(--ink-3);cursor:pointer;padding:4px 9px;border-radius:6px;line-height:1}
.nd-close:hover{background:var(--chip);color:var(--ink)}
.nd-body{overflow-y:auto;padding:8px 10px 28px;flex:1 1 auto}
.nd-grp{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:15px 8px 5px}
.nd-grp:first-child{margin-top:6px}
.navdrawer a.nd-link{display:block;font-size:13px;color:var(--ink);padding:5px 10px;border-radius:7px;text-decoration:none;line-height:1.35}
.navdrawer a.nd-link:hover{background:var(--accent-soft);color:var(--accent)}
.navdrawer a.nd-link.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nd-studies-toggle{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);text-align:left;background:transparent;border:none;cursor:pointer;margin:15px 8px 5px;padding:0;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.nd-count{font-weight:700;color:var(--ink-2);background:var(--chip);border-radius:9999px;padding:0 7px;font-size:10px;letter-spacing:0}
.nd-caret{margin-left:auto;transition:transform .15s ease;font-size:11px}
.nd-studies-toggle[aria-expanded="true"] .nd-caret{transform:rotate(90deg)}
.navdrawer .nd-studies a.nd-link{padding-left:16px;font-size:12.5px;color:var(--ink-2)}

/* ---- study card ---- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:26px 28px;margin:24px 0;box-shadow:var(--shadow);scroll-margin-top:112px}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--pass)}
.card.is-fail::before{background:var(--fail)}
.card.is-control{border-style:dashed;border-color:var(--line-2)}
/* collapsed cards are wholly clickable — signal it clearly */
.card.collapsed{cursor:pointer;padding-bottom:44px;transition:box-shadow .15s ease,border-color .15s ease,transform .12s ease}
.card.collapsed:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(30,25,20,.10),0 1px 0 var(--line);transform:translateY(-1px)}
.card.collapsed::after{content:"Click to expand ▾";position:absolute;right:24px;bottom:16px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);pointer-events:none}
.card.collapsed:hover::after{color:var(--accent)}
.card.collapsed:hover .ctoggle{color:var(--accent)}
.card-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px;cursor:pointer;user-select:none}
.card-h .ctoggle{color:var(--ink-3);font-size:15px;padding-top:5px;transition:transform .15s,color .15s;line-height:1}
.card.collapsed .card-h .ctoggle{transform:rotate(-90deg)}
.card-h .cnum{font-family:var(--mono);color:var(--ink-3);font-size:14px;padding-top:5px}
/* collapse behaviour */
.card.collapsed .study-detail{display:none}
.card:not(.collapsed) .study-summary{display:none}
.study-summary{margin-top:10px}
.summary-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:6px 0}
.summary-snip{color:var(--ink-2);font-size:13.5px;max-width:none;margin-top:6px}
.studies-toolbar{display:flex;gap:8px;align-items:center;margin-left:auto}
.studies-toolbar button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.studies-toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.card-h .ctitle{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;flex:1;line-height:1.2}
.card-h .cright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.control-kick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}
.claim{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin:8px 0 2px;max-width:none;font-style:italic}
.biology{color:var(--ink-2);font-size:14px;margin:8px 0 4px;max-width:none}

/* spine stage */
.stage{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.stage:first-of-type{border-top:none}
.stage>.kicker{display:block;margin-bottom:12px}
.substage{margin:14px 0}
.substage .slabel{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.kv{color:var(--ink);font-size:14.5px}
.kv .rationale{color:var(--ink-2);font-size:13.5px;margin-top:4px;max-width:none}
.decision-line{font-size:15px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;
  border-radius:999px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.pass{color:var(--pass);background:var(--pass-soft)}
.chip.fail{color:var(--fail);background:var(--fail-soft)}
.chip.decision{background:none;border:1px solid var(--accent);color:var(--accent)}
.chip.mod{background:none;border:1px solid var(--line-2);color:var(--ink);font-family:var(--mono);font-size:11.5px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* mini table for tests */
.ttable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.ttable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable tr:last-child td{border-bottom:none}
.ttable .tname{font-weight:600}
.ttable .texp{color:var(--ink-3);font-family:var(--mono);font-size:12px}
.ttable .tv{text-align:right;white-space:nowrap}

/* decision box */
.decbox{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--sunken);
  border-radius:10px;margin-top:6px}
.decbox>div:last-child{flex:1 1 auto;min-width:0}
.decbox .dverdict{font-size:14px}
.decbox .dnarr{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:none}

/* figures */
figure{margin:12px 0 4px}
figure svg{max-width:100%;height:auto;display:block}
figure img{max-width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.spine-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.spine-badge.v-passed{color:var(--pass);background:var(--pass-soft)}
.spine-badge.v-failing{color:var(--fail);background:var(--fail-soft)}
.spine-badge.v-blocked,.spine-badge.v-needs_calibration{color:var(--warn);background:var(--warn-soft)}
.spine-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.spine-legend-item{font-size:11.5px;color:var(--ink-2)}
/* "Methods · Simulations" block — locked shared node-card spec (1:1 with the live
   workbench graph). The spec's slate hex is mapped to the report's theme tokens so
   the block is dark-mode-aware and harmonizes with the report palette; structure,
   class names and the fidelity-chip vocabulary (real tool / reproduction) are kept
   exactly as the live graph's. */
.aig-methods-block{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:0.78em}
.aig-methods-head{font-weight:600;color:var(--ink-2);margin-bottom:3px}
.aig-methods-row{display:flex;gap:8px;line-height:1.55}
.aig-methods-label{color:var(--ink-3);flex:0 0 56px}
.aig-methods-val{color:var(--ink);min-width:0}
.aig-methods-val.allpass{color:var(--pass)}
.aig-fidelity-chip{display:inline-block;margin-left:7px;padding:0 7px;border-radius:999px;font-size:0.9em;font-weight:600;vertical-align:baseline}
.aig-fidelity-real{background:color-mix(in srgb,var(--cal) 15%,var(--surface));color:var(--cal);border:1px solid color-mix(in srgb,var(--cal) 32%,transparent)}
.aig-fidelity-repro{background:var(--chip);color:var(--ink-2);border:1px solid var(--line-2)}
.study-verdict-dag{margin-top:4px}
figcaption{color:var(--ink-2);font-size:12.5px;margin-top:8px;max-width:none}
.fig-scroll{overflow-x:auto}
.loom-embed{margin:12px 0 4px}
.loom-frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);height:440px;resize:vertical;min-height:240px}
/* An inlined local: visualization runs in its own iframe so its scripts execute
   and its (often full-document) CSS can't leak into the report. onload sizes it
   to content; this is the pre-resize default. */
.viz-frame{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:460px;display:block}
/* embedded REAL bigraph-loom (primary Model view) */
.loom-real-slot{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:560px;overflow:hidden;resize:vertical;min-height:280px}
.loom-real-slot iframe{width:100%;height:100%;border:0;display:block}
.loom-real-boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px}
/* interactive lightweight loom */
.iloom{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:520px;overflow:hidden}
.iloom svg{width:100%;height:100%;cursor:grab;display:block}
.iloom svg.grabbing{cursor:grabbing}
.iloom .il-proc,.iloom .il-comp{cursor:pointer}
.iloom .il-comp{cursor:pointer}
.iloom .il-proc rect,.iloom .il-comp rect{transition:opacity .12s}
.iloom .dim{opacity:.18}
.iloom .il-edge.off{stroke-opacity:.05!important}
.iloom .il-edge.on{stroke-opacity:.95!important;stroke-width:2.2!important}
.iloom .il-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:11px;line-height:1.35;
  padding:6px 9px;border-radius:6px;max-width:340px;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.iloom .il-hint{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:var(--ink-3);background:var(--surface);
  padding:2px 7px;border-radius:6px;border:1px solid var(--line);opacity:.9}
.iloom .il-stores{position:absolute;right:10px;top:10px;max-width:46%;max-height:70%;overflow:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.iloom .il-leaves{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.iloom .il-leaf{font-family:var(--mono);font-size:10px;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
/* An interactive (Plotly) figure rendered inline in the main document, sharing
   the report's one Plotly.js. Bordered like the iframe path it replaces. */
.embedded-plotly .plotly-holder{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;overflow:hidden}
.embedded-plotly .plotly-holder>div{max-width:100%}
.loom-iframe{width:100%;height:100%;border:0;display:block}
.loom-fallback{margin-top:6px}
.loom-fallback>summary{cursor:pointer;color:var(--accent);font-size:12px;user-select:none}
.loom-fallback[open]>summary{margin-bottom:6px}

/* expander */
details.exp{margin-top:10px;border-top:1px dotted var(--line-2);padding-top:8px}
details.exp>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none}
details.exp>summary::-webkit-details-marker{display:none}
details.exp>summary::before{content:"▸ ";color:var(--ink-3)}
details.exp[open]>summary::before{content:"▾ "}
details.exp .body{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:none}

/* §7 figure-first card slots */
.disc-control{margin-top:8px;padding:8px 11px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink-2)}
.dc-k{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.card-limitation{padding:11px 14px;background:color-mix(in srgb,var(--warn) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 32%,var(--line));border-left:3px solid var(--warn);border-radius:8px;font-size:13.5px;color:var(--ink);line-height:1.5}
.ho-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:5px 0}
.ho-dir{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.ho-who{color:var(--ink-3);font-weight:600}
.ho-items{display:flex;gap:5px;flex-wrap:wrap}
.tech-record{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.tech-record>.body{margin-top:12px}

/* appendix */
.appendix{margin:52px 0 24px}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.cat-table td,.cat-table th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cat-table th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.cat-table .m{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}

/* breadcrumb + prev/next + study grid */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);padding:26px 0 2px}
.crumb a{color:var(--ink-2);font-weight:600}
.crumb .cur{color:var(--ink)}
.crumb .chev{opacity:.5}
.prevnext{display:flex;justify-content:space-between;gap:12px;margin:28px 0 8px}
.prevnext a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.prevnext a:hover{border-color:var(--accent);text-decoration:none}
.prevnext a.next{text-align:right;align-items:flex-end}
.prevnext .dir{font-size:11px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.prevnext .nm{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:8px}
.gcard{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--accent);text-decoration:none}
.gcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--pass)}
.gcard.is-fail::before{background:var(--fail)}
.gcard .gh{display:flex;align-items:baseline;gap:8px}
.gcard .gn{font-family:var(--mono);color:var(--ink-3);font-size:12px}
.gcard .gt{font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.2}
.gcard .grole{color:var(--ink-2);font-size:12.5px}
.gcard .gclaim{color:var(--ink-2);font-size:13px;line-height:1.5;font-style:italic}
.gcard .gfoot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.gcard .garrow{color:var(--accent);font-size:13px;font-weight:600}
/* per-section feedback bubble */
.fbsection{position:relative}
.fbbubble{position:absolute;right:-6px;top:-4px;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);font-size:13px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .12s,transform .12s,color .12s,border-color .12s;box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.fbsection:hover>.fbbubble{opacity:.85}
.fbbubble:hover{opacity:1 !important;transform:scale(1.08);color:var(--accent);border-color:var(--accent)}
.fbbubble.has{opacity:1;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.fbbubble.has::after{content:"";position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:999px;background:var(--accent);border:1.5px solid var(--surface)}
.fbeditor-wrap{margin-top:12px;padding:12px 14px;background:var(--sunken);border:1px solid var(--line);border-radius:10px}
.fbeditor-wrap .fbrow{margin-top:0;padding-top:0;border-top:none}
@media(max-width:640px){.fbbubble{opacity:.6}}
/* feedback */
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line-2)}
.fbrow .fblabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fbdisp{display:flex;gap:4px}
.fbdisp button{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.fbdisp button.on-ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.fbdisp button.on-rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.fbrow input.fbnote{flex:1;min-width:180px;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
.fbrow input.fbnote:focus{outline:none;border-color:var(--accent)}
.fbfloat{position:fixed;right:22px;bottom:22px;z-index:60;background:var(--accent);color:#fff;border:none;
  border-radius:999px;padding:12px 18px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,118,107,.4);display:flex;align-items:center;gap:8px}
.fbfloat .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;font-size:12px}
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(20,18,15,.5);display:none;align-items:center;justify-content:center;padding:24px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:720px;width:100%;
  max-height:82vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--serif);font-size:20px;margin:0;padding:20px 22px 6px}
.modal .sub{color:var(--ink-2);font-size:13px;padding:0 22px 12px}
.modal textarea{flex:1;margin:0 22px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:280px;resize:vertical}
.modal .mfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px}
.modal .mfoot button{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.modal .mfoot button.primary{background:var(--accent);color:#fff;border-color:transparent}
/* ---- planned (not-yet-run) study state ---- */
.status.planned{color:var(--ink-3);background:var(--chip)}
.chip.planned{color:var(--ink-3);background:var(--chip)}
.card.is-planned::before{background:var(--line-2)}
.card.is-planned{border-style:dashed;border-color:var(--line-2)}
.stats .num.planned{color:var(--ink-3)}
.glance .chip.planned{background:var(--chip)}

/* ---- hypothesis & evidence (cited top-level claims) ---- */
.argument{margin:26px 0 8px;position:relative}
.argument .main-claim{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink);margin:2px 0 16px;max-width:none}
.claimlist{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.claimlist li{padding-left:16px;border-left:2px solid var(--line-2);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.claimlist li .ctext{color:var(--ink)}
.claimlist li.counter{border-left-color:var(--warn)}
.cframes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cframe{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.cframe .rel{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-left:5px}
/* ---- citation chips + provenance ---- */
.refchip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;font-family:var(--sans);
  line-height:1.3;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
  white-space:nowrap;border:1px solid transparent;vertical-align:baseline}
a.refchip:hover{text-decoration:none;border-color:var(--accent)}
.refchip.unknown{background:var(--chip);color:var(--ink-3)}
.citerow{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center;margin-left:4px;vertical-align:baseline}
.cite-lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.anchors{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.anchors th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.anchors td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.anchors tr:last-child td{border-bottom:none}
.anchors .ax-exp{font-weight:600;color:var(--ink)}
.anchors .ax-obs{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.anchors .ax-status{color:var(--ink-2);font-size:12.5px}
.anchors .ax-met{color:var(--pass);font-weight:700}
.assumptions{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:13px}
.assumptions li{margin:3px 0}
/* references section */
.refs-list{display:grid;gap:0;margin-top:8px}
.refentry{padding:4px 10px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;scroll-margin-top:120px}
.refentry:target{background:var(--accent-soft);border-radius:8px}
.refentry .rk{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.refentry .rt{color:var(--ink)}
.refentry .rmeta{color:var(--ink-2)}
.refentry .rcount{float:right;font-size:11px;color:var(--ink-3)}
footer{border-top:1px solid var(--line);margin-top:48px;padding:24px 0 60px;color:var(--ink-3);font-size:12.5px}
footer .wrap{display:flex;flex-direction:column;gap:6px}
.reasoning-step{margin:2px 0}

/* ======================================================================
   PUBLISHED-REPORT FRONT MATTER + SCIENTIFIC FRAMING
   A reading measure (~68ch) for prose; the opening reads like a paper —
   question → abstract → the simulated world → thesis → findings.
   ====================================================================== */
.prose{max-width:92ch}
.prose p{margin:0 0 14px}
.prose p:last-child{margin-bottom:0}
.measure{max-width:92ch}
/* hero scientific question — the FIRST thing the report states */
.hero-q{margin:30px 0 6px}
.hero-q .qlabel{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero-q .qtext{font-family:var(--serif);font-size:25px;line-height:1.38;color:var(--ink);margin:0;max-width:54ch;text-wrap:pretty;font-weight:500}
@media(max-width:640px){.hero-q .qtext{font-size:20px}}
/* abstract — larger, lighter, set at a reading measure */
.abstract{margin:22px 0 8px;max-width:92ch}
.abstract p{font-family:var(--serif);font-size:18px;line-height:1.62;color:var(--ink-2);margin:0 0 12px}
.abstract p:first-child::first-letter{font-size:1.05em}
.abstract .main-claim{color:var(--ink);font-style:normal}
/* a labelled prose section (Background / The simulated world) */
.narr{margin:8px 0}
/* Merged "Synthesis & gaps": the sub-sections keep their anchors/feedback but
   their headings demote to sub-heads so the three read as one section. */
.syn-group>.narr{margin:16px 0 0}
.syn-group>.narr>.sec-h{margin-bottom:4px}
.syn-group>.narr>.sec-h h2{font-size:15px;font-weight:650;letter-spacing:0}
.syn-group>.narr>.sec-h .rule{display:none}
.narr .prose{color:var(--ink-2);font-size:15.5px;line-height:1.78}
.narr .prose b{color:var(--ink)}
/* "the simulated world" standing callout */
.world{margin:16px 0;padding:20px 22px;background:var(--sunken);border:1px solid var(--line);border-radius:12px}
.world .wlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.world .prose{color:var(--ink-2);font-size:14.5px;line-height:1.75}
/* "what counts as evidence" principled note */
.evnote{margin:16px 0;padding:16px 20px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.evnote .prose{color:var(--ink);font-size:14px;line-height:1.7;max-width:92ch}
.evnote b{color:var(--ink)}

/* evidentiary-status tiers: Observed / Plausible / Hypothetical */
.etier{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:2px 9px;border-radius:999px;white-space:nowrap;vertical-align:baseline;border:1px solid transparent}
.etier .d{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
.etier.observed{color:var(--pass);background:var(--pass-soft)}
.etier.plausible{color:var(--cal);background:color-mix(in srgb,var(--cal) 12%,transparent)}
.etier.hypothetical{color:var(--warn);background:var(--warn-soft);border-style:dashed;border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.etier-legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 2px;font-size:12.5px;color:var(--ink-2);align-items:center}
.etier-legend .li{display:flex;align-items:center;gap:7px}
.etier-legend .li .def{color:var(--ink-3);font-size:11.5px}

/* four-part scientific unit (study card primary structure) */
.sci-unit{margin:12px 0 4px;display:grid;gap:12px}
.sci-part{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
.sci-part .sp-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.sci-part .sp-v{font-size:15px;line-height:1.6;color:var(--ink);max-width:88ch}
.sci-part.q .sp-v{font-family:var(--serif);font-size:16.5px;color:var(--ink);line-height:1.5}
.sci-part .sp-v .muted{color:var(--ink-2)}
.sci-part .sp-v .mono{color:var(--ink-2)}
@media(max-width:640px){.sci-part{grid-template-columns:1fr;gap:3px}.sci-part .sp-k{padding-top:0}}


/* ======================================================================
   WORKBENCH-CONSISTENT INVESTIGATION GRAPH (ported from walkthrough.js
   _renderInvestigationDag): same depth-BFS layout, same node-card markup,
   same Bezier edge routing + arrowheads. Static: no drag/zoom; each node
   badged with the SAME _studyStatusMeta the workbench uses. Adapted to the
   report's theme tokens (surface/line) so it works in light + dark.
   ====================================================================== */
.wdag-shell{position:relative;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--sunken);
  padding:4px;max-height:620px;margin-top:6px}
.wdag-canvas{position:relative}
.wdag-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.wdag-node{position:absolute;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--line-2);
  border-radius:8px;padding:10px 12px;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,0.05);font-size:13px}
.wdag-node .wn-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.wdag-node .wn-icon{font-size:1.05em;line-height:1;flex:none}
.wdag-node .wn-badge{font-size:.62em;font-weight:700;white-space:nowrap}
.wdag-node .wn-title{display:block;font-size:.85em;line-height:1.3;color:var(--ink);font-weight:700}
.wdag-node a.wn-title:hover{color:var(--accent);text-decoration:none}
.wdag-node .wn-row{font-size:.72em;margin-top:6px;line-height:1.35;color:var(--ink-2);
  display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.wdag-node .wn-row .wn-lbl{font-weight:600;color:var(--ink)}
.wdag-node .wn-etier{margin-top:7px}
/* Compact (lowest semantic zoom) — used for the PDF: title + status only, at a
   LARGER font than the detail cards, so the whole graph stays legible when it
   spans pages. */
.wdag-shell.dag-compact .wn-row,
.wdag-shell.dag-compact .wn-etier,
.wdag-shell.dag-compact .wn-exp{display:none !important}
.wdag-shell.dag-compact .wdag-node{padding:9px 12px !important}
.wdag-shell.dag-compact .wn-title{font-size:14.5px !important;line-height:1.28 !important;-webkit-line-clamp:3 !important}
.wdag-shell.dag-compact .wn-badge{font-size:11.5px !important}
.wdag-shell.dag-compact .wn-icon{font-size:14px !important}
/* Click-to-expand: only cards whose Asks/Finds are actually clipped get the
   affordance (data-clip set by setupWorkbenchDag after measuring). The caret
   lives in the fixed-height meta row, so toggling it causes no layout shift.
   Expanding unclamps the rows and floats the card over its neighbours — the
   same in-place interrogation the live workbench graph offers. */
.wdag-node .wn-rt{display:inline-flex;align-items:center;gap:6px;flex:none}
.wdag-node .wn-exp{font-size:.72em;line-height:1;color:var(--ink-3);display:none;
  transition:transform .12s ease,color .12s ease}
.wdag-node[data-clip]{cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.wdag-node[data-clip] .wn-exp{display:inline-block}
.wdag-node[data-clip]:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,0.10)}
.wdag-node[data-clip]:hover .wn-exp{color:var(--accent)}
.wdag-node.wn-expanded{z-index:40;box-shadow:0 10px 28px rgba(0,0,0,0.20)}
.wdag-node.wn-expanded .wn-exp{transform:rotate(180deg);color:var(--accent)}
.wdag-node.wn-expanded .wn-row{-webkit-line-clamp:unset!important;line-clamp:unset!important}
.wdag-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12px;color:var(--ink-2);
  padding:10px 2px 0;margin-top:2px}
.wdag-legend .lg{display:inline-flex;align-items:center;gap:5px}
.wdag-legend .lg .i{font-size:1em}

@media(max-width:640px){
  .masthead h1{font-size:30px}.verdict .vtext{font-size:17px}
  .card{padding:20px}.wrap{padding:0 16px}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <span class="brand">Vivarium <span class="dot">·</span> Workbench</span>
  <span class="switch-label" id="wsname"></span>
  <button class="themebtn" id="themebtn" title="Toggle theme">◐</button>
</div></div>

<main id="app"></main>

<button class="fbfloat" id="fbfloat">Review &amp; export <span class="cnt" id="fbcnt">0</span></button>
<div class="modal-bg" id="modalbg"><div class="modal">
  <h3>Feedback report</h3>
  <div class="sub">Your notes across the report, as a YAML feedback document — the same shape the workbench ingests. Copy it, or select all and save.</div>
  <textarea id="fbyaml" spellcheck="false" readonly></textarea>
  <div class="mfoot">
    <button id="fbcopy">Copy YAML</button>
    <button class="primary" id="fbclose">Close</button>
  </div>
</div></div>

<footer><div class="wrap">
  <div>Rendered from workspace <span class="mono" id="foot-ws"></span> · deterministic from investigation + study YAML.</div>
  <div id="foot-prov" class="mono"></div>
</div></footer>

<!-- One shared Plotly.js for the whole report: every interactive figure is
     rendered inline in this document and uses this single copy (empty when the

ns a distinct acetate specialist: 93% of the acetate specialist's biomass gain occurs after the acetate pool peaks, and glucose is exhausted exactly at the peak (t=8.3) — niche differentiation by cross-feeding, not competitive exclusion.", "biological_summary": "Two E. coli populations sit in the same flask, drawing on one pool of glucose and acetate. They are not different organisms — both run the same core metabolic network — but they are tuned to different niches. One is a glucose specialist: it takes up glucose fast, but its oxygen supply is capped, so like real E. coli growing quickly it cannot fully burn the sugar and spills the excess carbon out as acetate. The other is an acetate specialist: it is poor at glucose but avid for acetate.\n\nRun forward, the community sorts itself into two acts. In the first, the glucose specialist blooms, multiplying about 116-fold while it strips the glucose to nothing by t=8.3. As it grows it pumps acetate into the shared pool, which climbs to a transient peak of 17 mM. In the second act the glucose is gone, but the flask is now full of acetate — exactly the feedstock the second species wants. The acetate specialist, which had barely moved during the glucose phase, now grows ~55-fold, and 93% of that growth happens after the acetate peak.\n\nThat temporal offset is the whole point. If the two populations were simply competing for one resource, the better competitor would exclude the other. Instead, the byproduct of the first species' metabolism becomes the niche of the second — cross-feeding. The model reproduces this from nothing more than two Monod uptake tunings, an oxygen cap, and a shared FBA pool, which is why it is a compact but complete demonstration of what the CRM-FBA composite can do.", "baseline": [{"name": "crm_fba_community", "composite": "crm_dfba.composites.crm_fba_community", "params": {}}], "behavior_tests": [{"name": "glucose-drawn-to-zero", "classification": "primary", "question": "Is the shared glucose po <script>
const INV = JSON.parse(document.getElementById('data').textContent);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Light markdown for authored prose fields (conclusions carry ## headers, **bold**, `code`).
function mdLite(t){
  if(t==null) return '';
  let s=esc(t);
  s=s.replace(/\s*#{2,}\s*([^\n]+?)\s*-\s+/g,'<br><b>$1</b> — ');   // "## Claims - " → bold header
  s=s.replace(/\s*#{1,}\s*([^\n]+)/g,'<br><b>$1</b>');              // any remaining # header
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<span class="mono">$1</span>');
  return s.replace(/^\s*<br>\s*/,'');
}

// The Model-section "loom view": the composite's resolved bigraph — the nested
// state tree (name : type) beside the process list (name · address · ports).
// Static bigraph of the composite — a self-contained SVG that reads like a
// process-bigraph: the PLACE GRAPH (compartments as containers holding their
// state leaves) on the right, the PROCESS nodes (with typed in/out ports) on the
// left, and the LINK GRAPH (each process wired to every compartment it reads or
// writes) drawn as connectors between them. Compartments, their state leaves and
// the wiring are all derived from the topology's edges ({p: process, c:
// compartment, s: state}); the declared store tree fills in any unwired
// compartments + leaf types. No server, no interactivity — embeds + prints.
function loomTopoSVG(topo){
  if(!topo) return '';
  const procs=topo.processes||[], edges=topo.edges||[], storeTree=topo.stores||[];

  // --- Derive the bigraph: compartment -> state leaves, and link weights. ---
  const compStates=new Map();          // compartment -> Set(state names)
  const typeOf={};                     // "comp" or "comp.state" -> type label
  edges.forEach(e=>{ if(e.c==null) return;
    if(!compStates.has(e.c)) compStates.set(e.c,new Set());
    if(e.s) compStates.get(e.c).add(e.s); });
  (function walk(ns){ (ns||[]).forEach(n=>{ if(n.name==null) return;
    if(!compStates.has(n.name)) compStates.set(n.name,new Set());
    if(n.type) typeOf[n.name]=n.type;
    (n.children||[]).forEach(ch=>{ if(ch.name){ compStates.get(n.name).add(ch.name);
      if(ch.type) typeOf[n.name+'.'+ch.name]=ch.type; } }); }); })(storeTree);
  const comps=[...compStates.keys()];
  if(!procs.length && !comps.length) return '';
  const linkStates={};                 // "proc|comp" -> Set(shared state names)
  edges.forEach(e=>{ if(e.p==null||e.c==null) return; const k=e.p+'|'+e.c;
    (linkStates[k]||(linkStates[k]=new Set())).add(e.s); });
  const outSet={};                     // proc -> Set(output port names) for read/write colouring
  procs.forEach(p=>{ outSet[p.name]=new Set(p.outputs||[]); });
  // Keep a process box's text on one line: truncate a port list to ~max chars,
  // trailing "+N" for the remainder, and clip an over-long address.
  const portStr=(arr,max)=>{ arr=(arr||[]).map(String); if(!arr.length) return '—';
    let out='',i=0; for(; i<arr.length; i++){ const nxt=out?out+', '+arr[i]:arr[i]; if(nxt.length>max && out) break; out=nxt; }
    const rem=arr.length-i; return (out.length>max?out.slice(0,max-1)+'…':out)+(rem>0?` +${rem}`:''); };
  const clip=(s,max)=>{ s=String(s||''); return s.length>max?s.slice(0,max-1)+'…':s; };

  // --- Geometry: processes (left column) ⇄ compartments (right column). ---
  const PADX=14, TOP=30, GAP=118, PW=236, CW=210, VGAP=16;
  const ph=p=>20+(p.address?13:0)+14+14+12;            // process box height
  const ch=c=>{ const n=compStates.get(c).size; return 22+(n?n*15+8:8); };  // compartment box height
  const procY={}; let py=TOP; procs.forEach(p=>{ procY[p.name]=py; py+=ph(p)+VGAP; });
  const compY={}; let cy=TOP; comps.forEach(c=>{ compY[c]=cy; cy+=ch(c)+VGAP; });
  const procX=PADX, compX=PADX+PW+GAP;
  const W=compX+CW+PADX, H=Math.max(py,cy)+6;

  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${procX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">PROCESSES</text>`;
  sv+=`<text x="${compX}" y="16" fill="var(--ink-3)" font-size="10" letter-spacing=".08em">COMPARTMENTS · STATE</text>`;

  // Link graph first, so the node boxes sit on top of the wires. A link is a
  // "write" (accent) when the process outputs any of the states it shares with
  // that compartment, else a "read" (muted); thickness grows with shared states.
  Object.keys(linkStates).forEach(k=>{ const [pn,cn]=k.split('|');
    if(procY[pn]==null||compY[cn]==null) return;
    const y1=procY[pn]+ph(procs.find(p=>p.name===pn))/2, y2=compY[cn]+ch(cn)/2;
    const x1=procX+PW, x2=compX, mx=(x1+x2)/2;
    const sts=linkStates[k], os=outSet[pn]||new Set();
    const write=[...sts].some(s=>os.has(s));
    const w=Math.min(4,sts.size), col=write?'var(--accent)':'var(--line-2)';
    sv+=`<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" `+
        `stroke="${col}" stroke-width="${0.8+w*0.5}" opacity="${write?0.55:0.4}"/>`;
  });

  // Process nodes: name, address, typed in/out ports.
  procs.forEach(p=>{ const y=procY[p.name], h=ph(p); let ty=y+21;
    sv+=`<rect x="${procX}" y="${y}" width="${PW}" height="${h}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<circle cx="${procX+PW}" cy="${y+h/2}" r="3.5" fill="var(--accent)"/>`;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12.5">${esc(p.name)}</text>`; ty+=15;
    if(p.address){ sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(clip(p.address,34))}</text>`; ty+=14; }
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">in: <tspan fill="var(--ink)">${esc(portStr(p.inputs,30))}</tspan></text>`; ty+=14;
    sv+=`<text x="${procX+12}" y="${ty}" fill="var(--ink-2)" font-size="10.5">out: <tspan fill="var(--ink)">${esc(portStr(p.outputs,29))}</tspan></text>`;
  });

  // Compartment containers (place graph): header + nested state leaves.
  comps.forEach(c=>{ const y=compY[c], h=ch(c), states=[...compStates.get(c)];
    sv+=`<rect x="${compX}" y="${y}" width="${CW}" height="${h}" rx="8" fill="var(--sunken)" stroke="var(--line)"/>`;
    sv+=`<circle cx="${compX}" cy="${y+h/2}" r="3.5" fill="var(--ink-3)"/>`;
    sv+=`<text x="${compX+11}" y="${y+15}" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="11.5">${esc(c)}</text>`;
    if(typeOf[c]) sv+=`<text x="${compX+CW-10}" y="${y+15}" text-anchor="end" fill="var(--ink-3)" font-size="9.5" font-family="var(--mono)">${esc(typeOf[c])}</text>`;
    states.forEach((s,j)=>{ const ly=y+22+j*15;
      sv+=`<rect x="${compX+9}" y="${ly}" width="${CW-18}" height="13" rx="3" fill="var(--surface)" stroke="var(--line)"/>`;
      sv+=`<text x="${compX+15}" y="${ly+10}" fill="var(--ink-2)" font-family="var(--mono)" font-size="10">${esc(s)}</text>`;
      const tt=typeOf[c+'.'+s]; if(tt) sv+=`<text x="${compX+CW-14}" y="${ly+10}" text-anchor="end" fill="var(--accent)" font-size="9" font-family="var(--mono)">${esc(tt)}</text>`;
    });
  });

  sv+=`</svg>`;
  const nLinks=Object.keys(linkStates).length;
  const cap=`Static bigraph of <span class="mono">${esc(topo.composite||'')}</span> — `+
    `${procs.length} process${procs.length==1?'':'es'} wired to ${comps.length} compartment${comps.length==1?'':'s'}`+
    (nLinks?` over ${nLinks} link${nLinks==1?'':'s'}`:'')+`. `+
    `<span style="color:var(--accent)">●</span> writes · <span style="color:var(--ink-3)">●</span> reads.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}

// Shared id counter for the loom-embed helpers below (loomRealEmbed).
let _ILOOM_SEQ=0;

// Embed the REAL bigraph-loom for a study's baseline composite — the same live
// loom the workbench serves at /bigraph-loom/, so the Model section shows loom's
// own rendering instead of a re-drawn topology. Returns '' when no composite is
// known (caller then falls back to the static topology SVG). When the report is
// opened standalone (file://) the loom route is unreachable and the iframe stays
// blank — the caption's "static topology" <details> is the offline fallback.
function loomEmbed(s){
  const cid=(s.model_topology&&s.model_topology.composite) || (s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const topo=s.model_topology?loomTopoSVG(s.model_topology):'';
  // No live loom to embed → nothing to add beyond the static topology, which
  // the caller renders directly. Returning '' lets modelBody fall through to it.
  if(!topo) return '';
  const snap=document.body.classList.contains('snapshot');
  const base='bigraph-loom/index.html';
  const src=snap
    ? base+'?static=1&stateUrl='+encodeURIComponent('api/composite-state/'+encodeURIComponent(cid)+'.json')+'&chrome=off'
    : base+'?id='+encodeURIComponent(cid)+'&live=1&chrome=off';
  // The static topology is the VISIBLE model figure — it always renders, live
  // server or not (a downloaded standalone report has no reachable loom route,
  // so a live iframe would just be a blank box). The interactive loom is an
  // opt-in enhancement tucked behind a <details> for deployments served
  // alongside the loom bundle.
  return `<figure class="loom-embed">
      <div class="kicker" style="margin-bottom:6px">Model — bigraph of <span class="mono">${esc(cid)}</span></div>
      ${topo}
      <figcaption>The composite's bigraph (processes, stores, and their wiring).
        <details class="loom-fallback"><summary>open the interactive bigraph-loom view</summary>
          <div class="loom-frame"><iframe class="loom-iframe" title="bigraph-loom — ${esc(cid)}" src="${esc(src)}" loading="lazy"></iframe></div>
        </details></figcaption>
    </figure>`;
}
// PRIMARY Model view (published bundle only): the REAL bigraph-loom, embedded
// chromeless + stripped (?embed=1) and driven by the composite-state snapshot
// that ships beside the report. This is the genuine loom renderer — process
// rectangles, store circles, the place-graph nesting and wiring, click a process
// for its contract — not a re-drawing. The two base URLs come from the DATA
// (INV.loom_embed), set only when publishing alongside the loom bundle; a
// standalone/self-contained report has no INV.loom_embed, so this returns '' and
// the Model section falls back to the inlined image / static topology.
// setupRealLooms() mounts it lazily and, if it can't boot, reveals the fallback.
function loomRealEmbed(s){
  const le=INV.loom_embed; if(!le||!le.loom||!le.state) return '';
  const cid=(s.model_topology&&s.model_topology.composite)||(s.baseline&&s.baseline[0]&&s.baseline[0].composite);
  if(!cid) return '';
  const stateUrl=le.state+encodeURIComponent(cid)+'.json';
  const src=le.loom+'?embed=1&static=1&stateUrl='+encodeURIComponent(stateUrl)+'&tab=explore';
  const fb=(s.model_loom
      ? `<div class="loom-frame" style="height:auto;max-height:640px;overflow:auto"><img src="${s.model_loom}" alt="bigraph-loom view of ${esc(cid)}" style="width:100%;display:block"/></div>`
      : (s.model_topology?loomTopoSVG(s.model_topology):''))||'';
  const id='loomreal'+(++_ILOOM_SEQ);
  return `<figure class="loom-embed loom-real" id="${id}" data-loomsrc="${esc(src)}">
      <div class="loom-real-slot"><div class="loom-real-boot">loading bigraph-loom…</div></div>
      <div class="loom-real-fallback" hidden>${fb}</div>
      <figcaption><b>bigraph-loom</b> — <span class="mono">${esc(cid)}</span>: the composite's process-bigraph (process rectangles, store nodes, and their wiring). Click a process for its contract; drag to pan, scroll to zoom.</figcaption>
    </figure>`;
}
const has = v => v!=null && !(Array.isArray(v)&&!v.length) && !(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);

/* ---------- helpers ---------- */
function statusChip(kind){
  const map={pass:['pass','Passed'],fail:['fail','Refuted'],warn:['warn','Open'],planned:['planned','Planned']};
  const [c,l]=map[kind]||map.warn; return `<span class="status ${c}"><span class="g"></span>${l}</span>`;
}
function gateOf(s){ // pass / fail / planned / warn
  const g = (s.sourcing&&s.sourcing.audit&&s.sourcing.audit.gate) || s.gate_status;
  if(g==='pass'||g==='passed') return 'pass';
  if(g==='fail'||g==='failed') return 'fail';
  // Not yet gated: a study the author marks Planned (or with no run at all) is
  // DESIGNED-not-run — a distinct state from an evaluated-but-open gate, so the
  // report never paints a not-yet-run study as if it had passed. Prefer the
  // server's canonical execution_status (study_ontology) over guessing from the
  // absence of runs.
  const ex=String(s.execution_status||'').toLowerCase();
  if(ex==='planned'||ex==='proposed') return 'planned';
  const c=(s.confidence||'').toLowerCase();
  if(c==='planned') return 'planned';
  if(!ex && !s.gate_status && !(s.runs&&s.runs.length)) return 'planned';
  return 'warn';
}
/* ---------- citation chips (provenance → References) ---------- */
let REFS={};
function refChip(key){
  if(!key) return '';
  const r=REFS[key]; const lbl=(r&&r.label)||key;
  const title=r&&r.title?` title="${esc(r.title)}"`:'';
  return `<a class="refchip${r?'':' unknown'}" href="#ref-${esc(key)}"${title}>${esc(lbl)}</a>`;
}
function citeRow(keys,label){
  const ks=(keys||[]).filter(Boolean);
  if(!ks.length) return '';
  return `<span class="citerow">${label?`<span class="cite-lbl">${esc(label)}</span>`:''}${ks.map(refChip).join('')}</span>`;
}
function isControl(s){ return gateOf(s)==='fail' && (s.confidence==='Refuted'||s.confidence==='Accepted') && !!s.conclusion; }
function loopOutcome(s){
  const r=(s.runs||[]).map(r=>r.outcomes&&r.outcomes['LOOP-OUTCOME']).find(Boolean);
  return r||null;
}

/* ---------- SVG visualizations ---------- */
// V1 capability coverage matrix: rows=requires, cols=chosen modules(+build-new), fill where provided
function vizCapMatrix(s,inv){
  const req=s.requires||[]; const mods=(s.sourcing&&s.sourcing.modules)||[];
  const cat=inv.catalog||{};
  if(!req.length) return '';
  const cols = mods.length?mods:['(build-new)'];
  const cw=Math.max(96,...cols.map(c=>c.length*7.2+24)), rh=30, lh=150, top=54;
  const W=lh+cols.length*cw+16, H=top+req.length*rh+10;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  cols.forEach((c,i)=>{ const x=lh+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" font-weight="600" fill="var(--ink)">${esc(c)}</text>`;
    sv+=`<text x="${x}" y="36" text-anchor="middle" fill="var(--ink-3)" font-size="10">provides</text>`;});
  req.forEach((r,ri)=>{ const y=top+ri*rh;
    const covered=cols.some(c=>(cat[c]||[]).includes(r));
    sv+=`<text x="${lh-12}" y="${y+rh/2+4}" text-anchor="end" fill="${covered?'var(--ink)':'var(--fail)'}" font-weight="${covered?400:700}">${esc(r)}</text>`;
    cols.forEach((c,ci)=>{ const x=lh+ci*cw, provides=(cat[c]||[]).includes(r);
      sv+=`<rect x="${x+6}" y="${y+4}" width="${cw-12}" height="${rh-9}" rx="5" fill="${provides?'var(--accent)':'var(--sunken)'}" stroke="${provides?'none':'var(--line)'}"/>`;
      if(provides) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="11" font-weight="700">✓</text>`;
    });
    if(!covered) sv+=`<rect x="${lh-4}" y="${y+2}" width="${cols.length*cw+4}" height="${rh-4}" rx="6" fill="none" stroke="var(--fail)" stroke-dasharray="4 3"/>`;
  });
  sv+=`</svg>`;
  const uncovered=req.filter(r=>!cols.some(c=>(cat[c]||[]).includes(r)));
  const cap=uncovered.length? `Required capability <span class="mono">${esc(uncovered.join(', '))}</span> is not provided by the chosen module — the coverage argument <span class="mono">requires ⊆ provided</span> fails, and the audit refuses the reuse.`
    : `Every required capability is provided by the chosen module(s): <span class="mono">requires ⊆ provided</span> holds.`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>${cap}</figcaption></figure>`;
}
// V3 audit axes chips
function vizAuditAxes(s){
  const ax=s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes; if(!ax) return '';
  const order=['source_fit','reinvention','novelty_justified','survey_recorded'];
  let chips=order.filter(k=>k in ax).map(k=>{ const ok=ax[k]==='within_tol';
    return `<span class="chip ${ok?'pass':'fail'}">${ok?'✓':'✗'} ${k.replace(/_/g,' ')}</span>`;}).join('');
  const catches=s.sourcing.audit.catches_if_wrong;
  return `<div class="chiprow" style="margin-top:4px">${chips}</div>`+
    (catches?`<div class="kv rationale" style="margin-top:8px"><b>Catches if wrong:</b> ${esc(catches)}</div>`:'');
}
// V2 sourcing decision map (investigation)
function vizDecisionMap(inv){

      sv+=`<text x="${cx}" y="${cy-3}" text-anchor="middle" fill="var(--ink)" font-weight="600" font-size="12.5">${esc(s.title.replace(/^Trap /,''))}</text>`;

      sv+=`<text x="${cx}" y="${cy+13}" text-anchor="middle" fill="var(--ink-3)" font-size="10.5" font-family="var(--mono)">${esc(mods)}</text>`;
      sv+=`<circle cx="${cx+bw/2-11}" cy="${cy-bh/2+11}" r="7" fill="${fail?'var(--fail)':'var(--pass)'}"/>`;
      sv+=`<text x="${cx+bw/2-11}" y="${cy-bh/2+14.5}" text-anchor="middle" fill="var(--surface)" font-size="9" font-weight="700">${fail?'✗':'✓'}</text>`;
      if(fail) sv+=`<text x="${cx}" y="${cy+bh/2+13}" text-anchor="middle" fill="var(--warn)" font-size="9.5" font-weight="700">⚑ ADVERSARIAL CONTROL</text>`;
      sv+=`</a>`;

  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Every sourcing decision placed in its lane; the node's badge is the audit gate. The dashed node is the deliberate trap — a plausible reuse the audit correctly refuses.</figcaption></figure>`;

// V6 agent-vs-policy outcome bar (investigation)
function vizOutcomeBar(inv){
  const rows=inv.studies.map(s=>{
    const at=s.agent_trajectory, pt=s.policy_trajectory;
    return {s, agent:at&&at.result, policy:pt&&pt.result};
  }).filter(r=>r.agent||r.policy);
  if(!rows.length) return '';
  const rh=46, top=30, padL=150, W=940, maxE=Math.max(1,...rows.flatMap(r=>[r.agent&&r.agent.edits||0,r.policy&&r.policy.edits||0]));
  const barMax=W-padL-150, unit=barMax/Math.max(maxE,3);
  const H=top+rows.length*rh+8;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padL}" y="18" fill="var(--ink-2)" font-size="10.5" font-weight="700">AGENT ▲  /  POLICY ▼   ·   bar = edits, terminal chip = outcome</text>`;
  rows.forEach((r,ri)=>{ const y=top+ri*rh;
    sv+=`<a href="#s-${r.s.slug}"><text x="${padL-12}" y="${y+rh/2}" text-anchor="end" fill="var(--ink)" font-weight="600" font-size="12.5">${esc(r.s.title)}</text></a>`;
    [['agent',r.agent,-1],['policy',r.policy,1]].forEach(([k,res,dir])=>{
      if(!res) return; const cy=y+rh/2+dir*10;
      const done=res.state==='DONE'; const w=Math.max(unit*(res.edits||0),6);
      sv+=`<rect x="${padL}" y="${cy-6}" width="${w}" height="12" rx="6" fill="${done?'var(--accent)':'var(--sunken)'}" stroke="${done?'none':'var(--line-2)'}"/>`;
      const chx=padL+w+8;
      sv+=`<text x="${chx}" y="${cy+4}" fill="${done?'var(--pass)':'var(--fail)'}" font-weight="700" font-size="11">${done?'✓ DONE':'✗ GIVE-UP'} · ${res.edits} edit${res.edits==1?'':'s'}</text>`;
    });
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Head-to-head across every task: the LLM agent (upper lane) reaches DONE where the deterministic policy (lower lane) gives up. Bar length is the number of model edits taken.</figcaption></figure>`;
}
// V4 margin ladder (study, build)
function vizMarginLadder(traj){
  if(!traj||!traj.iterations||!traj.iterations.length) return '';
  const its=traj.iterations, tests=(its[0].tests||[]).map(t=>t.id);
  if(!tests.length) return '';
  const cw=Math.max(52,(700-160)/its.length), rh=34, top=40, padL=160;
  const W=padL+its.length*cw+10, H=top+tests.length*rh+16;
  const maxAbs=Math.max(1,...its.flatMap(it=>(it.tests||[]).map(t=>Math.abs(t.margin||0))));
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  its.forEach((it,i)=>{ const x=padL+i*cw+cw/2;
    sv+=`<text x="${x}" y="20" text-anchor="middle" fill="var(--ink-2)" font-size="10.5" font-weight="600">iter ${it.iteration}</text>`;
    sv+=`<text x="${x}" y="33" text-anchor="middle" fill="var(--ink-3)" font-size="9.5">${it.n_pass}/${it.n_hard}</text>`;});
  tests.forEach((tid,ri)=>{ const y=top+ri*rh;
    const lbl=(its[0].tests[ri].label)||tid;
    sv+=`<text x="${padL-12}" y="${y+rh/2+4}" text-anchor="end" fill="var(--ink)" font-size="11.5">${esc(lbl.length>26?lbl.slice(0,25)+'…':lbl)}</text>`;
    its.forEach((it,ci)=>{ const t=(it.tests||[])[ri]; if(!t) return; const x=padL+ci*cw;
      const ok=t.verdict==='within_tol'; const op=(0.28+0.72*Math.min(1,Math.abs(t.margin||0)/maxAbs)).toFixed(2);
      const isLast=ci===its.length-1;
      sv+=`<rect x="${x+5}" y="${y+4}" width="${cw-10}" height="${rh-9}" rx="5" fill="${ok?'var(--pass)':'var(--fail)'}" fill-opacity="${ok?0.9:op}" stroke="${isLast?'var(--ink)':'none'}" stroke-width="${isLast?1.4:0}"/>`;
      const fixed=(it.newly_fixed||[]).includes(tid);
      if(fixed) sv+=`<text x="${x+cw/2}" y="${y+rh/2+4}" text-anchor="middle" fill="var(--surface)" font-size="12" font-weight="700">✦</text>`;
    });
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Each locked test (row) across build iterations (columns); green = passing, red = failing (deeper = larger margin from the bar). <b>✦</b> marks the iteration a test was newly fixed; the ringed column is the final model.</figcaption></figure>`;
}
// V5 iteration timeline
function timelineSteps(traj){
  if(!traj||!traj.iterations) return '';
  const steps=traj.iterations.map(it=>{
    const d=it.decision||{}; const act=d.action||d.kind||'';
    let label=act;
    if(d.mechanism) label='install '+d.mechanism;
    else if(d.value) label=(d.action||'')+' '+d.value;
    else if(act==='done') label='DONE';
    else if(act==='blocked'||act==='install') label=act;
    const reason=d.reasoning||d.note||'';
    return {it:it.iteration,label,reason,np:it.n_pass,nh:it.n_hard};
  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}

/* ---------- V7 gate matrix (investigation) : tests × studies ---------- */
