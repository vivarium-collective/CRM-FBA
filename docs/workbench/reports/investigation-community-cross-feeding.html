  });
  let html='<div style="margin-top:6px">';
  steps.forEach((s,i)=>{
    const pct=s.nh?Math.round(100*s.np/s.nh):0;
    html+=`<div class="reasoning-step" style="display:flex;gap:10px;align-items:baseline;padding:4px 0">
      <span class="mono" style="color:var(--ink-3);min-width:34px">i${s.it}</span>
      <span style="font-weight:600;min-width:180px">${esc(s.label)}</span>
      <span style="flex:1;height:6px;background:var(--sunken);border-radius:4px;overflow:hidden;max-width:160px">
        <span style="display:block;height:100%;width:${pct}%;background:var(--accent)"></span></span>
      <span class="mono" style="color:var(--ink-2);font-size:11px">${s.np}/${s.nh}</span></div>`;
    if(s.reason) html+=`<div class="kv rationale" style="margin:0 0 6px 44px;font-size:12.5px">${esc(s.reason)}</div>`;
  });
  html+='</div>';
  return html;
}

/* ---------- V7 gate matrix (investigation) : tests × studies ---------- */
function vizGateMatrix(inv){
  const studies=inv.studies.filter(s=>s.agent_trajectory&&s.agent_trajectory.iterations&&s.agent_trajectory.iterations.length);
  if(studies.length<2) return '';
  // union of test ids is heterogeneous across tasks; instead show pass-count per study as a compact dot bar
  const rh=30, top=24, padL=150, W=760;
  const H=top+studies.length*rh+10, maxN=Math.max(...studies.map(s=>lastIt(s).n_hard||1));
  const cell=Math.min(26,(W-padL-40)/maxN);
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  sv+=`<text x="${padL}" y="16" fill="var(--ink-2)" font-size="10.5" font-weight="700">FINAL TEST OUTCOMES · one square per locked test</text>`;
  studies.forEach((s,ri)=>{ const y=top+ri*rh, it=lastIt(s), ts=it.tests||[];
    sv+=`<a href="#s-${s.slug}"><text x="${padL-12}" y="${y+rh/2+4}" text-anchor="end" fill="var(--ink)" font-weight="600" font-size="12">${esc(s.title)}</text></a>`;
    ts.forEach((t,ci)=>{ const ok=t.verdict==='within_tol'; const x=padL+ci*(cell+4);
      sv+=`<rect x="${x}" y="${y+3}" width="${cell}" height="${cell}" rx="4" fill="${ok?'var(--pass)':'var(--fail)'}" fill-opacity="${ok?.9:.5}"><title>${esc(t.label||t.id)}: ${ok?'pass':'fail'}</title></rect>`;
    });
    sv+=`<text x="${padL+ts.length*(cell+4)+8}" y="${y+rh/2+4}" fill="var(--ink-2)" font-size="11" font-weight="600">${it.n_pass}/${it.n_hard}</text>`;
  });
  sv+=`</svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>Every task's final model against its own locked acceptance tests — the agent drives each to a full green row.</figcaption></figure>`;
}
function lastIt(s){const its=s.agent_trajectory.iterations;return its[its.length-1];}

/* ---------- model diagram (the "model SVG") ---------- */
function modelText(s){ const cm=(s.conclusion||'').match(/##\s*Final model\s*([\s\S]*?)(?:\n##|$)/i);
  return (cm?cm[1].trim():'')||s.biological_summary||''; }
function vizModelSVG(s, inv){
  if(s.sourcing){
    const mods=(s.baseline||[]).filter(b=>b.module||b.name);
    const boxes=mods.length?mods:[{name:'new module',domain:'built for this task'}];
    const bw=200,bh=58,gap=30,padT=54,x0=20;
    const W=Math.max(560,x0+boxes.length*(bw+gap)), H=padT+bh+58;
    let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
    // task node
    sv+=`<rect x="${x0}" y="14" width="${(s.requires||[]).length?260:180}" height="28" rx="8" fill="var(--sunken)" stroke="var(--line)"/>`;
    sv+=`<text x="${x0+12}" y="32" fill="var(--ink-2)" font-size="11">task requires: <tspan fill="var(--ink)" font-family="var(--mono)">${esc((s.requires||[]).join(', '))}</tspan></text>`;
    boxes.forEach((b,i)=>{ const x=x0+i*(bw+gap), y=padT;
      sv+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="var(--surface)" stroke="var(--accent)"/>`;
      sv+=`<text x="${x+bw/2}" y="${y+24}" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="13">${esc(b.name)}</text>`;
      sv+=`<text x="${x+bw/2}" y="${y+42}" text-anchor="middle" fill="var(--ink-2)" font-size="11">${esc((b.domain||'').slice(0,34))}</text>`;
      sv+=`<line x1="${x+bw/2}" y1="42" x2="${x+bw/2}" y2="${y}" stroke="var(--line-2)" stroke-width="1.5" marker-end="url(#ar)"/>`;
      if(i>0) sv+=`<line x1="${x-gap}" y1="${y+bh/2}" x2="${x}" y2="${y+bh/2}" stroke="var(--line-2)" stroke-dasharray="3 3"/>`;
    });
    sv+=`<text x="${x0}" y="${H-14}" fill="var(--ink-3)" font-size="11">${esc(s.sourcing.decision)} · ${boxes.length>1?'composed':'single module'}</text>`;
    sv+=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
    return `<figure><div class="fig-scroll">${sv}</div><figcaption>The sourced model: ${boxes.length>1?'the composed modules':'the reused module'} that supply the task's required capabilities.</figcaption></figure>`;
  }
  // agentic: extract CamelCase process names + stores from the final-model text
  const text=modelText(s);
  const procs=[...new Set((text.match(/\b[A-Z][a-z]+(?:[A-Z][a-z0-9]+)+\b/g)||[]))]
    .filter(p=>!/^(Composite|Process|Hill|Cellular|Potts|Rust|Monod|ParCa|Wnt)$/.test(p)).slice(0,6);
  const sm=text.match(/over ([a-z0-9_\/ ,]+)/i);
  const stores=sm?sm[1].split(/[\/,]/).map(x=>x.trim()).filter(Boolean).slice(0,6):[];
  if(!procs.length){ // fallback: single composite box
    const bl=(s.baseline||[])[0];
    return `<figure><div class="kv mono texp">${esc(bl&&bl.composite||'process-bigraph Composite')}</div><figcaption>${esc(text||'A process-bigraph Composite run through the engine.')}</figcaption></figure>`;
  }
  const bw=Math.max(120,...procs.map(p=>p.length*8+24)),bh=42,gap=24,x0=16,padT=24;
  const rowW=x0+procs.length*(bw+gap), storeY=padT+bh+40;
  const W=Math.max(560,rowW), H=stores.length?storeY+40:padT+bh+30;
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12.5">`;
  sv+=`<text x="${x0}" y="16" fill="var(--ink-3)" font-size="10.5" letter-spacing=".06em">PROCESSES</text>`;
  procs.forEach((p,i)=>{ const x=x0+i*(bw+gap), y=padT;
    sv+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="var(--accent)"/>`;
    sv+=`<text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" fill="var(--ink)" font-weight="700" font-family="var(--mono)" font-size="12">${esc(p)}</text>`;
    if(i>0) sv+=`<line x1="${x-gap}" y1="${y+bh/2}" x2="${x}" y2="${y+bh/2}" stroke="var(--line-2)" marker-end="url(#ar2)"/>`;
    if(stores.length) sv+=`<line x1="${x+bw/2}" y1="${y+bh}" x2="${x+bw/2}" y2="${storeY}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  });
  if(stores.length){
    sv+=`<text x="${x0}" y="${storeY-8}" fill="var(--ink-3)" font-size="10.5" letter-spacing=".06em">STORES</text>`;
    let sx=x0; stores.forEach(st=>{ const w=st.length*7.5+20;
      sv+=`<rect x="${sx}" y="${storeY}" width="${w}" height="26" rx="13" fill="var(--sunken)" stroke="var(--line)"/>`;
      sv+=`<text x="${sx+w/2}" y="${storeY+17}" text-anchor="middle" fill="var(--ink-2)" font-family="var(--mono)" font-size="11">${esc(st)}</text>`; sx+=w+10; });
  }
  sv+=`<defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
  return `<figure><div class="fig-scroll">${sv}</div><figcaption>The process-bigraph Composite the agent built: ${procs.length} process${procs.length>1?'es':''}${stores.length?` wired over ${stores.length} shared stores`:''}, run through the engine.</figcaption></figure>`;
}

/* ---------- block renderers (spine) ---------- */
// dense tests / report-card table: description, machine criterion, provenance, final verdict + observed + margin
function testsTable(tests, traj){
  let finals={}, prov={};
  if(traj){
    if(traj.iterations&&traj.iterations.length)
      (traj.iterations[traj.iterations.length-1].tests||[]).forEach(t=>finals[t.id]={v:t.verdict,exp:t.expected,obs:t.observed,m:t.margin});
    (traj.tests||[]).forEach(t=>{prov[t.id]={exp:t.expected,provenance:t.provenance,label:t.label};});
  }
  const rows=(tests||[]).map(t=>{
    const name=t.name||t.id, desc=t.description||t.label||(prov[name]&&prov[name].label)||'';
    const meas=t.measure&&(t.measure.path||t.measure.observable||t.measure.kind);
    const cls=t.classification;
    const fin=finals[name]; const v=fin?(fin.v==='within_tol'?'pass':'fail'):null;
    const exp=(fin&&fin.exp)||(prov[name]&&prov[name].exp)||(t.pass_if&&(t.pass_if.op+' '+t.pass_if.value))||'';
    const pv=provText((prov[name]&&prov[name].provenance))||provText(t.pass_if&&t.pass_if.provenance)||(t.measure&&t.measure.kind==='audit-axis'?('audit axis '+meas):'');
    const obs=(fin&&fin.obs!=null)?`observed ${fmt(fin.obs)}`:'';
    const mg=(fin&&fin.m!=null)?` · margin ${fmt(fin.m)}`:'';
    return `<tr id="test-${esc(name)}"><td class="tname">${esc(desc||name)}
        <div class="texp mono">${esc(name)}${cls?' · '+esc(cls):''}${meas?' · '+esc(meas):''}</div>
        ${pv?`<div class="kv rationale" style="font-size:12px;margin-top:3px">${esc(pv)}</div>`:''}</td>
      <td class="tv"><div>${exp?`<span class="mono texp">${esc(exp)}</span>`:''} ${v?`<span class="chip ${v}" style="margin-left:6px">${v==='pass'?'✓ pass':'✗ fail'}</span>`:'<span class="chip">pending</span>'}</div>
        ${obs?`<div class="texp mono" style="margin-top:3px">${esc(obs)}${esc(mg)}</div>`:''}</td></tr>`;
  }).join('');
  return `<table class="ttable">${rows}</table>`;
}
function fmt(n){ if(typeof n!=='number') return esc(n); return Number.isInteger(n)?n:(Math.abs(n)<0.01?n.toExponential(1):n.toFixed(2)); }
// provenance may be a plain string OR an object ({kind, note, ...}); render a
// readable line, never a stringified object ("[object Object]").
function provText(p){ if(!p) return ''; if(typeof p==='string') return p;
  if(typeof p==='object') return String(p.note||p.rationale||p.kind||Object.values(p).filter(v=>typeof v==='string').join(' · ')||''); return String(p); }

function fbBubble(key,label){ return `<button class="fbbubble ${FB[key]?'has':''}" data-fb="${esc(key)}" data-fblabel="${esc(label)}" title="Add feedback to this section" aria-label="Add feedback to ${esc(label)}">💬</button>`; }
function part(label, body, key, klabel){ if(!body) return '';
  return `<div class="substage fbsection">${key?fbBubble(key,klabel||label):''}<div class="slabel">${label}</div>${body}</div>`; }

// traceability anchor built via the prefix helper (assembled, not a hardcoded
// href), so a finding's from_test resolves to its test-card anchor
function _traceLink(prefix, name){ return '<a class="trace-link" href="#' + prefix + '-' + esc(name) + '">' + esc(name) + '</a>'; }

// a copy-to-run command chip; '' for a falsy command (older payloads / static bundle)
function _runChip(cmd){ if (!cmd) return ''; return '<code class="run-chip" title="copy to run">' + esc(cmd) + '</code>'; }

// per-outcome rows separating the AUTHORED result from the COMPUTED/measured
// value (divergence badged), instead of a raw key:value dump
function outcomeRows(outcomes){
  return Object.entries(outcomes||{}).map(([k,o])=>{
    o=o||{}; const authored=o.result;
    const computed=(o.computed!=null?o.computed:o.measured_value);
    const diverge=(computed!=null && String(computed)!==String(authored));
    return `<div class="computed-outcome-row"><span class="mono" style="color:var(--ink-2)">${esc(k)}</span>
      <span class="outcome-chip-authored chip">authored: ${esc(authored)}</span>
      ${computed!=null?`<span class="outcome-chip-computed chip ${diverge?'reconcile-divergent':''}">computed: ${esc(computed)}</span>`:''}
      ${o.detail?`<span class="texp" style="margin-left:6px">${esc(o.detail)}</span>`:''}</div>`;
  }).join('');
}

// high-level overview shown when a study is COLLAPSED
function studySummary(s, inv){
  const chips=[];
  if(s.sourcing){
    chips.push(`<span class="chip decision">${esc(s.sourcing.decision)}</span>`);
    (s.sourcing.modules||[]).forEach(m=>chips.push(`<span class="chip mod">${esc(m)}</span>`));
    const ax=s.sourcing.audit&&s.sourcing.audit.axes;
    if(ax){ const ok=Object.values(ax).filter(v=>v==='within_tol').length; chips.push(`<span class="chip">audit ${ok}/${Object.keys(ax).length} axes</span>`); }
  } else {
    const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
    if(a) chips.push(`<span class="chip ${a.state==='DONE'?'pass':'fail'}">agent ${a.state==='DONE'?'✓ '+a.edits+'e':'✗'}</span>`);
    if(p) chips.push(`<span class="chip ${p.state==='DONE'?'pass':'fail'}">policy ${p.state==='DONE'?'✓':'✗ give-up'}</span>`);
    const it=s.agent_trajectory&&lastIt(s); if(it) chips.push(`<span class="chip">tests ${it.n_pass}/${it.n_hard}</span>`);
  }
  const runN=(s.runs||[]).length; if(runN) chips.push(`<span class="chip">${runN} run${runN>1?'s':''}</span>`);
  const nfig=(s.figures_embedded||[]).filter(f=>f.data_uri||f.html).length; if(nfig) chips.push(`<span class="chip">${nfig} figure${nfig>1?'s':''}</span>`);
  const nfind=Array.isArray(s.findings)?s.findings.length:0; if(nfind) chips.push(`<span class="chip">${nfind} finding${nfind>1?'s':''}</span>`);
  let concl=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!concl && s.purpose && s.purpose.question) concl=s.purpose.question;
  const snip=concl.split(/(?<=[.!?])\s/).slice(0,2).join(' ');
  return `<div class="summary-chips">${chips.join('')}</div>${snip?`<div class="summary-snip">${esc(snip)}</div>`:''}`;
}

function renderStudy(s, inv, idx){
  const gate=gateOf(s), fail=gate==='fail', control=isControl(s), lo=loopOutcome(s);
  const dchip=fail?'fail':'pass';

  // OVERVIEW  (falls back to purpose.* for workspaces that use a `purpose:` block)
  const pq = s.purpose && s.purpose.question, pm = s.purpose && s.purpose.mechanism;
  const headline = s.claim || s.question || pq;
  const claimLine = s.claim? `<div class="claim">“${esc(s.claim)}”</div>` : (headline? `<div class="claim">${esc(headline)}</div>`:'');
  const bioText = s.biological_summary || pm;
  const overview = (bioText && headline)?`<div class="biology">${esc(bioText)}</div>`:'';

  // MODEL — prefer a pre-rendered bigraph-loom image (offline-safe, config
  // loaded, from `vivarium-workbench render-loom`); else the live loom iframe;
  // else the re-drawn static topology / viz.
  const bl=(s.baseline||[])[0];
  const _mcid=(s.model_topology&&s.model_topology.composite)||(bl&&bl.composite)||'';
  const loomRendered = s.model_loom
    ? `<figure class="loom-embed"><div class="loom-frame" style="height:auto;max-height:640px;overflow:auto">
         <img src="${s.model_loom}" alt="bigraph-loom view of ${esc(_mcid)}" style="width:100%;display:block"/></div>
       <figcaption><b>bigraph-loom</b> view of <span class="mono">${esc(_mcid)}</span> — the composite's bigraph with its config loaded.</figcaption></figure>`
    : '';
  // Prefer the lightweight INTERACTIVE loom (pan/zoom, hover contracts, click to
  // expand stores) when we have the wired topology; fall back to the pre-rendered
  // image, the live loom iframe, the static SVG topology, then a plain viz.
  const loomInter = (s.model_topology && (s.model_topology.edges||[]).length) ? loomInteractive(s.model_topology) : '';
  // Prefer the REAL embedded loom (served bundle); it carries its own offline
  // fallback. Then the pre-rendered image, the lightweight SVG loom, the static
  // topology, and finally a plain viz.
  const loomReal = loomRealEmbed(s);
  let modelBody = loomReal || loomRendered || loomInter || (s.model_topology ? loomTopoSVG(s.model_topology) : '') || vizModelSVG(s,inv);
  if(s.sourcing){
    modelBody += `<div class="decision-line" style="margin-top:6px"><span class="chip decision">${esc(s.sourcing.decision)}</span>
      ${(s.sourcing.modules||[]).map(m=>`<span class="chip mod">${esc(m)}</span>`).join(' ')||'<span class="chip mod">new module</span>'}</div>
      ${s.sourcing.rationale?`<div class="kv rationale">${esc(s.sourcing.rationale)}</div>`:''}`;
  } else if(bl&&bl.composite){
    modelBody += `<div class="texp mono" style="margin-top:4px">${esc(bl.composite)}</div>`;
  }

  // SIMULATION RUN
  const runs=s.runs||[];
  let runBody = runs.length?runs.map(r=>{
    return `<div class="kv" style="margin:6px 0"><span class="chip ${r.status==='completed'?'pass':''}">${esc(r.status)}</span>
      <span class="mono" style="margin-left:8px;color:var(--ink-2)">${esc(r.name||r.module||'')}</span>
      ${outcomeRows(r.outcomes)}
      ${r.provenance?`<div class="texp mono" style="margin-top:2px">${esc(provText(r.provenance))}</div>`:''}</div>`;
  }).join(''):'';
  // run-command chips: how to reproduce this study + per-variant commands
  if(s.run_commands){
    const _base = s.run_commands && s.run_commands.baseline;
    if(_base) runBody += `<div class="reproduce-line texp" style="margin-top:6px">Reproduce: ${_runChip(_base)}</div>`;
    const _rcVariants = (s.run_commands && s.run_commands.variants) || [];
    _rcVariants.forEach(_vc=>{ runBody += `<div class="texp">${esc(_vc.name)}: ${_runChip(_vc && _vc.cmd)}</div>`; });
  }

  // VISUALIZATIONS (study figures + inlined images + audit axes)
  const figs=[];
  if(s.agent_trajectory) figs.push(['Margin ladder — LLM agent', vizMarginLadder(s.agent_trajectory)]);
  if(s.policy_trajectory) figs.push(['Margin ladder — deterministic policy control', vizMarginLadder(s.policy_trajectory)]);
  if(s.sourcing) figs.push(['Capability coverage', vizCapMatrix(s,inv)]);
  let figHtml=figs.filter(f=>f[1]).map(([t,svg])=>`<div style="margin:12px 0"><div class="kicker" style="margin-bottom:6px">${esc(t)}</div>${svg}</div>`).join('');
  // on-disk study visualizations, inlined by the generator: images as data
  // URIs, and `local:` live visualizations as their committed rendered HTML.
  (s.figures_embedded||[]).forEach(im=>{
    if(im.data_uri) figHtml+=`<figure><img src="${im.data_uri}" alt="${esc(im.name)}" loading="lazy"><figcaption>${esc(im.name)}</figcaption></figure>`;
    // Interactive figure (Plotly): the generator stripped its own Plotly loader
    // and handed us just the graph <div> + its Plotly.newPlot script. Render it
    // INLINE in the main document so it draws with the report's one shared
    // Plotly.js. The script stays inert until setupLazyPlotly() runs it the first
    // time the figure is actually laid out with a real width (see below) — so a
    // tab-hidden / collapsed figure is drawn at correct size when revealed, never
    // blank.
    else if(im.html && im.interactive) figHtml+=`<figure class="embedded-viz embedded-plotly" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><div class="plotly-holder">${im.html}</div></figure>`;
    // Any other committed HTML figure keeps the isolated-iframe path.
    else if(im.html) figHtml+=`<figure class="embedded-viz" style="margin:12px 0"><figcaption class="kicker" style="margin-bottom:6px">${esc(im.name)}</figcaption><iframe class="viz-frame" srcdoc="${esc(im.html)}" loading="lazy" onload="try{this.style.height=(this.contentWindow.document.documentElement.scrollHeight+8)+'px';}catch(e){}"></iframe></figure>`;
    else if(im.skipped) figHtml+=`<div class="texp" style="color:var(--ink-3)">↪ ${esc(im.name)} — ${esc(im.reason||'not inlined')}</div>`;
  });
  const auditHtml=(s.sourcing&&s.sourcing.audit&&s.sourcing.audit.axes)?`<div style="margin:10px 0"><div class="kicker" style="margin-bottom:6px">Audit — sourcing gate (4 axes)</div>${vizAuditAxes(s)}</div>`:'';
  const vizBody=(figHtml+auditHtml)||'';

  // TESTS (+ build reasoning for agentic)
  let testsBody = has(s.behavior_tests)?testsTable(s.behavior_tests, s.agent_trajectory):'';
  if(s.agent_trajectory){
    const at=s.agent_trajectory;
    testsBody += `<details class="exp"><summary>How the agent converged — iteration-by-iteration</summary><div class="body">${timelineSteps(at)}`;
    if(at.result&&has(at.result.violations)) testsBody+=`<div class="kv rationale" style="margin-top:8px;color:var(--warn)"><b>Integrity trail:</b> ${at.result.violations.map(esc).join('; ')}</div>`;
    if(s.policy_trajectory){const pr=s.policy_trajectory.result||{};
      testsBody+=`<div class="kv rationale" style="margin-top:8px"><b>Deterministic-policy control:</b> ${pr.state==='DONE'?`also DONE in ${pr.edits} edits`:`gave up after ${pr.edits} edit${pr.edits==1?'':'s'}`}.</div>`;}
    testsBody+=`</div></details>`;
  }

  // FINDINGS (with traceability: from_test anchored to its test card, the cited
  // pass_if band inlined, divergence surfaced, run_ids as plain code, seeded-study back-link)
  let findingsBody='';
  if(Array.isArray(s.findings) && s.findings.length){
    const bands={}; (s.behavior_tests||[]).forEach(t=>{ if(t.pass_if) bands[t.name||t.id]=t.pass_if; });
    findingsBody=s.findings.map(f=>{
      const ok=(f.status==='passed'||f.status==='pass');
      const ft=f.evidence&&f.evidence.from_test, band=ft&&bands[ft];
      const runIds=(f.provenance&&f.provenance.run_ids)||[];
      const dv=f.divergence_factor;
      return `<div class="finding-traceability" style="margin:8px 0">
        <span class="chip ${ok?'pass':''}">${esc((f.id?f.id+' · ':'')+(f.status||'finding'))}</span>
        <div class="kv rationale">${esc(f.statement||'')}</div>
        ${ft?`<div class="texp">from test: ${_traceLink('test',ft)}${band?` <span class="pass_if-band mono">${esc((band.op||'')+' '+(band.value!=null?band.value:''))}</span>`:''}</div>`:''}
        ${dv!=null?`<div class="finding-divergence texp">divergence ${esc(dv)}× vs expected</div>`:''}
        ${runIds.length?`<div class="texp">runs: ${runIds.map(r=>`<code>${esc(r)}</code>`).join(' ')}</div>`:''}
        ${f.seeded_study?`<div class="finding-seeded texp">seeded study: ${_traceLink('s',f.seeded_study)}</div>`:''}</div>`;
    }).join('');
  }

  // DECISION  (conclusion, or a conclusion_logic block for pipeline-style studies)
  let conclusion=(s.conclusion||'').replace(/##\s*Final model[\s\S]*?(?=\n##|$)/i,'').replace(/##\s*Result/i,'').trim();
  if(!conclusion && s.conclusion_logic && s.conclusion_logic.if_primary_tests_pass){
    const cl=s.conclusion_logic.if_primary_tests_pass;
    conclusion=[cl.implementation_status, cl.biological_validation].filter(Boolean).join(' ');
  }
  // gate divergence: the code-computed gate verdict vs the authored gate_status
  let gateDiv='';
  const cg=s.computed_gate_verdict;
  if(cg){
    const code=cg.result||'', authored=s.gate_status||'';
    const same=(code===authored)||(code==='passing'&&authored==='passed')||(code==='failing'&&authored==='failed');
    if(cg.diverges_from_authored===true || (code && authored && !same))
      gateDiv=`<div class="sp-gate-divergence chip warn" style="margin-top:8px">⚠ gate divergence — code: ${esc(code)} · authored: ${esc(authored)}</div>`;
  }
  const decisionBody=`<div class="decbox"><div>${statusChip(dchip)}</div>
    <div><div class="dverdict"><b>${fail?'Gate refused':'Gate cleared'}</b> · ${esc(s.confidence||'')}${lo?` · <span class="mono">${esc(lo.result)} (${esc(lo.detail||'')})</span>`:''}</div>
    ${conclusion?`<div class="dnarr">${mdLite(conclusion)}</div>`:''}${gateDiv}</div></div>`;

  return `<section class="card collapsed ${fail?'is-fail':''} ${control?'is-control':''}" id="s-${s.slug}">
    <div class="card-h">
      <span class="ctoggle">▾</span>
      <span class="cnum">${String(idx).padStart(2,'0')}</span>
      <h3 class="ctitle">${esc(s.title)}</h3>
      <div class="cright">${control?'<span class="control-kick">⚑ Adversarial control</span>':''}${statusChip(dchip)}</div>
    </div>
    ${claimLine}${overview}
    <div class="study-summary">${studySummary(s,inv)}</div>
    <div class="study-detail">
      ${part('Model', modelBody, 'study:'+s.slug+'/model', s.title+' · Model')}
      ${part('Simulation run', runBody, 'study:'+s.slug+'/simulation', s.title+' · Simulation run')}
      ${part('Visualizations', vizBody, 'study:'+s.slug+'/visualizations', s.title+' · Visualizations')}
      ${part('Tests', testsBody, 'study:'+s.slug+'/tests', s.title+' · Tests')}
      ${part('Findings', findingsBody, 'study:'+s.slug+'/findings', s.title+' · Findings')}
      ${part('Decision', decisionBody, 'study:'+s.slug+'/decision', s.title+' · Decision')}
      ${feedbackRow('study:'+s.slug, 'this whole study')}
    </div>
  </section>`;
}

/* ---------- executive band ---------- */
// The report adapts to what the studies ACTUALLY are, rather than assuming an
// agent-vs-policy competition. Three modes:
//   sourcing  — studies carry a `sourcing` decision (model-sourcing investigations)
//   agentic   — studies carry an `agent_trajectory` (LLM-agent vs policy tasks)
//   generic   — everything else (a normal study: model · run · tests · decision)
function reportMode(inv){
  const ss=inv.studies||[];
  // 'sourcing' is for a sourcing-AUDIT investigation — one whose figure is the
  // reuse/compose/build-new decision map with an audit gate. Requires the actual
  // audit data (s.sourcing.audit), NOT merely a `sourcing.decision`: that is now
  // standard contract metadata on nearly every study, so keying off `s.sourcing`
  // alone mislabelled ordinary claim/agentic investigations as sourcing and
  // showed them an empty, trap-captioned decision map.
  if(ss.some(s=>s.agent_trajectory||s.policy_trajectory)) return 'agentic';
  if(ss.some(s=>s.sourcing&&s.sourcing.audit)) return 'sourcing';
  return 'generic';
}
function renderExec(inv){
  const studies=inv.studies;
  const MODE=reportMode(inv);
  const gates=studies.map(gateOf);
  const nPass=gates.filter(g=>g==='pass').length, nFail=gates.filter(g=>g==='fail').length;
  const exv=inv.executive||{};
  const verdictText = exv.verdict || inv.question;
  const status = exv.verdict_status==='passed'?'pass':(inv.status==='in_progress'?'warn':'pass');
  // stat strip
  let stats='';
  if(MODE==='sourcing'){
    const dec={};studies.forEach(s=>{const d=s.sourcing&&s.sourcing.decision;if(d)dec[d]=(dec[d]||0)+1;});
    stats=[[studies.length,'studies'],[dec['reuse']||0,'reuse'],[dec['compose']||0,'compose'],[dec['build-new']||0,'build-new'],[nFail,'trap refused ✗','fail']];
  }else if(MODE==='agentic'){
    let aDone=0,pDone=0,pTot=0;
    studies.forEach(s=>{ if(s.agent_trajectory&&s.agent_trajectory.result&&s.agent_trajectory.result.state==='DONE')aDone++;
      if(s.policy_trajectory){pTot++; if(s.policy_trajectory.result&&s.policy_trajectory.result.state==='DONE')pDone++;} });
    stats=[[studies.length,'tasks'],[aDone+'/'+studies.length,'agent solved','pass'],[pDone+'/'+pTot,'policy solved'],[studies.length-pDone,'need an agent']];
  }else{
    // generic: describe the evidence base — studies, gate outcomes, acceptance tests
    let nTests=0; studies.forEach(s=>{ nTests+=(s.behavior_tests||[]).length; });
    stats=[[studies.length,'studies'],[nPass,'passed','pass']];
    if(nFail) stats.push([nFail,'failing','fail']);
    stats.push([nTests,'acceptance test'+(nTests===1?'':'s')]);
  }
  const statHtml=stats.map(([n,l,c])=>`<div class="stat"><div class="num ${c||''}">${n}</div><div class="lbl">${l}</div></div>`).join('');
  // glance table
  const glance=studies.map((s,i)=>{
    const g=gateOf(s), role=roleLine(s,inv), ctrl=isControl(s);
    return `<tr><td class="idx">${i+1}</td>
      <td><a class="st" href="#s-${s.slug}">${esc(s.title)}</a>${ctrl?'<span class="flag">⚑ control</span>':''}</td>
      <td style="color:var(--ink-2)">${role}</td>
      <td style="text-align:right">${g==='fail'?'<span class="chip fail">✗ refuted</span>':g==='pass'?'<span class="chip pass">✓ pass</span>':'<span class="chip">open</span>'}</td></tr>`;
  }).join('');
  const howto = MODE==='sourcing'
    ? `Each study is one <b>sourcing decision</b> — reuse an existing module, compose several, or build a new one. A deterministic audit grades the decision on four axes (<span class="mono">source_fit · reinvention · novelty_justified · survey_recorded</span>) by checking <span class="mono">requires ⊆ provided</span> against the module catalog. A study whose gate <b>fails</b> while it is still marked complete is an <b>adversarial control</b> — a plausible-but-wrong choice the audit is meant to refuse.`
    : MODE==='agentic'
    ? `Each study is a <b>model-building task</b> run twice: an LLM agent and a deterministic worst-margin policy each try to build a real process-bigraph model that passes the same <b>locked</b> acceptance tests. The <b>margin ladder</b> shows each test across build iterations; the <b>timeline</b> shows what the agent edited and why. The contrast is where an agent is genuinely required — where the policy has no move for the real fix and gives up.`
    : `Each study builds and runs a real <b>process-bigraph composite</b> and checks it against declared <b>acceptance tests</b>. Each study section shows its <b>model</b> (the composite's bigraph), how to <b>reproduce the run</b>, its <b>visualizations</b>, the <b>tests</b> and their verdicts, and the <b>decision</b>. Studies are collapsed to a high-level overview — expand any study for the full detail.`;
  return `<div class="verdict fbsection ${status==='fail'?'is-fail':''}">
      ${fbBubble('overview','Investigation overview')}
      <div class="vhead">${statusChip(status)}<span class="kicker">Verdict</span></div>
      <p class="vtext">${esc(verdictText)}</p>
      ${exv.what_is_this?`<div class="what">${esc(exv.what_is_this)}</div>`:(inv.hypothesis?`<div class="what">${esc(inv.hypothesis)}</div>`:'')}
      ${inv.lead?`<div class="what" style="margin-top:8px">${esc(inv.lead)}</div>`:''}
      <details class="exp"><summary>How to read this report</summary><div class="body">${howto}</div></details>
    </div>
    <div class="stats">${statHtml}</div>
    <div class="sec-h"><h2>At a glance</h2><span class="rule"></span></div>
    <table class="glance"><thead><tr><th></th><th>Study</th><th>${MODE==='sourcing'?'Sourcing decision':MODE==='agentic'?'Agent vs policy':'Evidence'}</th><th style="text-align:right">Gate</th></tr></thead><tbody>${glance}</tbody></table>`;
}
// dedicated place for the FINAL investigation-level visualizations
function renderInvViz(inv){
  const figs=[];
  const MODE=reportMode(inv);
  if(MODE==='sourcing'){ figs.push(['Sourcing decision map', vizDecisionMap(inv)]); }
  else if(MODE==='agentic'){ figs.push(['Agent vs policy — outcomes', vizOutcomeBar(inv)]); figs.push(['Final test outcomes', vizGateMatrix(inv)]); }
  else { figs.push(['Test outcomes across studies', vizGateMatrix(inv)]); }
  const live=figs.filter(f=>f[1]); if(!live.length) return '';
  return `<div id="inv-viz" class="fbsection">${fbBubble('figures','Investigation visualizations')}<div class="sec-h"><h2>Investigation visualizations</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px;max-width:none;margin:0 0 6px">The whole investigation in a few figures — the synthesis across all ${inv.studies.length} studies.</p>
    ${live.map(([t,svg])=>`<div style="margin:20px 0"><div class="kicker" style="margin-bottom:8px">${esc(t)}</div>${svg}</div>`).join('')}</div>`;
}
function roleLine(s,inv){
  if(s.sourcing){ const mods=(s.sourcing.modules||[]).join(' + ')||'new module';
    return `${esc(s.sourcing.decision)} · <span class="mono">${esc(mods)}</span>`; }
  const a=s.agent_trajectory&&s.agent_trajectory.result, p=s.policy_trajectory&&s.policy_trajectory.result;
  if(a||p){
    const av=a?(a.state==='DONE'?`agent ✓ ${a.edits}e`:'agent ✗'):'';
    const pv=p?(p.state==='DONE'?` · policy ✓`:` · policy ✗ give-up`):'';
    return av+pv;
  }
  // generic: the most informative available summary — test count + what it found
  const nt=(s.behavior_tests||[]).length;
  const c=s.verdict_counts||{}; const np=c.passed||0;
  let summary=s.claim||(s.findings&&s.findings[0]&&(s.findings[0].summary||s.findings[0].claim))||'';
  summary=String(summary).split('\n')[0].trim();
  const bits=[];
  if(nt) bits.push(`${np?np+'/':''}${nt} test${nt===1?'':'s'}${np?' pass':''}`);
  if(summary) bits.push(`<span style="color:var(--ink-2)">${esc(summary.length>90?summary.slice(0,88)+'…':summary)}</span>`);
  return bits.join(' · ')||'—';
}

/* ---------- appendix ---------- */
function renderAppendix(inv){
  if(!inv.catalog) return '';
  const rows=Object.entries(inv.catalog).map(([m,caps])=>
    `<tr><td class="m">${esc(m)}</td><td>${caps.map(c=>`<span class="chip mod" style="margin:2px">${esc(c)}</span>`).join('')}</td></tr>`).join('');
  return `<div class="appendix fbsection" id="appendix">
    ${fbBubble('appendix','Module catalog')}
    <div class="sec-h"><h2>Module catalog</h2><span class="rule"></span></div>
    <p style="color:var(--ink-2);font-size:14px;max-width:none">The reusable modules and the capabilities each declares — the ground truth the sourcing audit checks every <span class="mono">requires ⊆ provided</span> claim against.</p>
    <table class="cat-table"><thead><tr><th>Module</th><th>Declared capabilities</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

/* ---------- feedback ---------- */
let FB={}, CUR='model-sourcing';
function fbKeyStore(){ return 'viva-fb-'+CUR; }
function loadFB(){ try{ FB=JSON.parse(localStorage.getItem(fbKeyStore())||'{}'); }catch(e){ FB={}; } }
function saveFB(){ try{ localStorage.setItem(fbKeyStore(), JSON.stringify(FB)); }catch(e){} updateCount(); }
function setFB(key,patch){ FB[key]={...(FB[key]||{}),...patch};
  if(!FB[key].note && !FB[key].disp) delete FB[key]; saveFB(); }
function fbCount(){ return Object.keys(FB).length; }
function updateCount(){ const el=document.getElementById('fbcnt'); if(el) el.textContent=fbCount(); }
function feedbackRow(key,label){ const f=FB[key]||{};
  return `<div class="fbrow" data-fbkey="${esc(key)}">
    <span class="fblabel">Feedback · ${esc(label)}</span>
    <div class="fbdisp">
      <button data-disp="ok" class="${f.disp==='ok'?'on-ok':''}">👍 Looks right</button>
      <button data-disp="revise" class="${f.disp==='revise'?'on-rev':''}">✏️ Needs revision</button>
    </div>
    <input class="fbnote" placeholder="Add a note…" value="${esc(f.note||'')}"></div>`;
}
function yq(s){ return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,' ')+'"'; }
function genYaml(inv){
  const L=['feedback_report:','  investigation: '+inv.slug,'  title: '+yq(inv.title),
    '  reviewer: ""','  date: ""'];
  const emit=(k,ind)=>{ const f=FB[k]||{}; if(f.disp) L.push(ind+'disposition: '+f.disp); if(f.note) L.push(ind+'note: '+yq(f.note)); };
  if(FB['overall']){ L.push('  overall:'); emit('overall','    '); }
  const invSecs=Object.keys(FB).filter(k=>k!=='overall'&&!k.startsWith('study:'));
  if(invSecs.length){ L.push('  sections:'); invSecs.forEach(k=>{ L.push('    - section: '+k); emit(k,'      '); }); }
  const rows=inv.studies.filter(s=>Object.keys(FB).some(k=>k==='study:'+s.slug||k.startsWith('study:'+s.slug+'/')));
  if(rows.length){ L.push('  studies:');
    rows.forEach(s=>{ L.push('    - study: '+s.slug); L.push('      verdict: '+gateOf(s));
      if(FB['study:'+s.slug]) emit('study:'+s.slug,'      ');
      const secs=Object.keys(FB).filter(k=>k.startsWith('study:'+s.slug+'/'));
      if(secs.length){ L.push('      sections:'); secs.forEach(k=>{ L.push('        - section: '+k.split('/')[1]); emit(k,'          '); }); }
    });
  }
  if(!Object.keys(FB).length) L.push('  # (no notes yet — hover any section and click the 💬 to add feedback)');
  return L.join('\n')+'\n';
}
function markBubble(key){ document.querySelectorAll('.fbbubble').forEach(b=>{ if(b.dataset.fb===key) b.classList.toggle('has', !!FB[key]); }); }

/* ---------- TOC + scroll spy ---------- */
function toc(inv){
  const items=['<a href="#top" class="exec">Overview</a>','<a href="#inv-viz">Figures</a>']
    .concat(inv.studies.map((s,i)=>`<a href="#s-${s.slug}" title="${esc(s.title)}">${i+1}. ${esc(shortTitle(s.title))}</a>`))
    .concat(inv.catalog?['<a href="#appendix">Appendix</a>']:[]).join('');
  return `<div class="subnav"><div class="wrap">${items}</div></div>`;
}
function shortTitle(t){ return t.length>22?t.slice(0,21)+'…':t; }
function spy(){
  const links=[...document.querySelectorAll('.subnav a')];
  const map={}; links.forEach(l=>map[l.getAttribute('href').slice(1)]=l);
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    links.forEach(l=>l.classList.remove('active')); const l=map[e.target.id]; if(l)l.classList.add('active');}});},
    {rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('.card,#top,#inv-viz,#appendix').forEach(el=>{if(el.id)obs.observe(el);});
}

/* ---------- spine presentation: verdict DAG · acceptance roll-up · AC gating matrix ---------- */
const VG={passed:['✅','passed'],failing:['⛔','failing'],blocked:['⚠','blocked'],
          needs_calibration:['🔄','needs calibration'],not_started:['◽','not evaluated']};
function _spineVerdictBadge(v){ const g=VG[v]||VG.not_started; return `<span class="spine-badge v-${v}">${g[0]} ${g[1]}</span>`; }
function _spineCountLabel(c){ if(!c) return ''; const p=[]; if(c.passed) p.push(c.passed+' passed'); if(c.skipped) p.push(c.skipped+' skipped'); if(c.failed) p.push(c.failed+' failed'); return p.join(' · '); }
function _acResultBadge(r){ const ok=(r==='passing'||r==='passed'||r==='passing-with-caveats'); const bad=(r==='failing'||r==='failed'); return `<span class="chip ${ok?'pass':(bad?'fail':'')}">${esc(r||'—')}</span>`; }

// V8 — verdict-annotated study DAG (renders only when there are dependency edges;
// otherwise the at-a-glance table already conveys the flat list)
function _verdictDagHtml(sp){
  const dag=sp&&sp.verdict_dag; if(!dag||!dag.edges||!dag.edges.length) return '';
  const nodes=dag.nodes, edges=dag.edges;
  const byDepth={}; let maxD=0;
  nodes.forEach(n=>{ (byDepth[n.depth]=byDepth[n.depth]||[]).push(n); if(n.depth>maxD)maxD=n.depth; });
  const colW=210, rowH=64, padL=8, padT=20, bw=180, bh=46;
  const maxRows=Math.max(...Object.values(byDepth).map(a=>a.length),1);
  const W=padL+(maxD+1)*colW, H=padT+maxRows*rowH+10;
  const pos={};
  Object.keys(byDepth).forEach(d=>{ byDepth[d].forEach((n,i)=>{ pos[n.slug]={x:padL+d*colW+bw/2, y:padT+i*rowH+bh/2}; }); });
  let sv=`<svg viewBox="0 0 ${W} ${H}" font-family="var(--sans)" font-size="12">`;
  edges.forEach(e=>{ const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    sv+=`<line x1="${a.x+bw/2}" y1="${a.y}" x2="${b.x-bw/2}" y2="${b.y}" stroke="var(--line-2)" marker-end="url(#dgar)"/>`; });
  nodes.forEach(n=>{ const p=pos[n.slug]; const g=VG[n.verdict]||VG.not_started;
    sv+=`<a href="#s-${n.slug}"><rect x="${p.x-bw/2}" y="${p.y-bh/2}" width="${bw}" height="${bh}" rx="9" fill="var(--surface)" stroke="var(--line-2)"/>`;
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y-4}" fill="var(--ink)" font-weight="600" font-size="12">${g[0]} ${esc(n.title.length>20?n.title.slice(0,19)+'…':n.title)}</text>`;
    const cl=_spineCountLabel(n.counts);
    sv+=`<text x="${p.x-bw/2+10}" y="${p.y+13}" fill="var(--ink-3)" font-size="10.5">${g[1]}${cl?' · '+esc(cl):''}</text></a>`; });
  sv+=`<defs><marker id="dgar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-2)"/></marker></defs></svg>`;
  const legend=Object.keys(VG).map(k=>`<span class="spine-legend-item">${VG[k][0]} ${VG[k][1]}</span>`).join('');
  return `<div class="study-verdict-dag"><div class="fig-scroll">${sv}</div>
    <div class="spine-legend">${legend}</div>
    <figcaption>Member studies as a dependency DAG (edges from <span class="mono">parent_studies</span>), each badged with its code-computed gate verdict.</figcaption></div>`;
}
function _acceptanceRollupHtml(sp){
  const a=sp&&sp.acceptance; if(!a||!(a.criteria&&a.criteria.length)) return '';
  const rows=a.criteria.map(c=>`<tr><td>${c.study?`<a href="#s-${esc(c.study)}">${esc(c.study)}</a>`:'—'}</td><td>${esc(c.behavior||'')}</td><td class="tv">${_acResultBadge(c.result)}</td></tr>`).join('');
  const div=a.diverges_from_authored?`<span class="acceptance-divergence chip warn">⚠ code differs from authored</span>`:'';
  return `<div class="acceptance-rollup"><div class="slabel">Acceptance roll-up ${div}</div>
    <p style="color:var(--ink-2);font-size:13.5px;max-width:none;margin:2px 0 8px">The investigation's acceptance criteria connected to their gating study and code-computed result — the spine roll-up, not a re-computation.</p>
    <table class="ttable"><tbody>${rows}</tbody></table></div>`;
}
function _acGatingMatrixHtml(sp){
  const m=sp&&sp.ac_matrix; if(!m||!(m.criteria&&m.criteria.length)) return '';
  const rows=m.criteria.map(c=> c.gap
    ? `<tr><td>${esc(c.behavior||'')}</td><td class="gap" style="color:var(--fail)">no study linked — gap</td><td></td></tr>`
    : `<tr><td>${esc(c.behavior||'')}</td><td><a href="#s-${esc(c.study)}">${esc(c.study)}</a></td><td class="tv">${_acResultBadge(c.result)}</td></tr>`).join('');
  const gaps=m.criteria.filter(c=>c.gap).length;
  const foot=gaps?`<div class="texp" style="color:var(--ink-3);margin-top:6px">${gaps} acceptance criteria have no study linked (gaps).</div>`:'';
  return `<div class="ac-gating-matrix"><div class="slabel">Acceptance-criteria gating matrix</div>
    <table class="ttable"><thead><tr><th>Criterion</th><th>Gating study</th><th class="tv">Result</th></tr></thead><tbody>${rows}</tbody></table>${foot}</div>`;
}
function renderSpine(inv){
  const sp=inv.spine; if(!sp) return '';
  const dag=_verdictDagHtml(sp), acc=_acceptanceRollupHtml(sp), mx=_acGatingMatrixHtml(sp);
  if(!dag && !acc && !mx) return '';
  return `<div id="spine-presentation" class="fbsection">${fbBubble('spine','Spine — verdicts & acceptance')}
    <div class="sec-h"><h2>Verdicts &amp; acceptance</h2><span class="rule"></span></div>
    ${dag}${acc?`<div style="margin-top:16px">${acc}</div>`:''}${mx?`<div style="margin-top:16px">${mx}</div>`:''}</div>`;
}

/* ---------- interactive (Plotly) figures — LAZY, visibility-driven ----------
   Each interactive figure is inlined as its graph <div> + its Plotly.newPlot
   <script>, which is INERT until the figure first becomes visible. We must NOT
   render eagerly at load: a figure inside a collapsed study card (display:none)
   or below the fold has zero width, so Plotly.newPlot would lay it out at 0px →
   a blank box that a later resize can't reliably recover (seen in Safari when a
   figure is revealed by a subnav tab / card expand). Instead each figure is
   rendered the first time it is actually laid out with a real width — created at
   the correct size. Fully guarded: no Plotly bundle, or a malformed figure, is a
   silent no-op. */
function _isLaidOut(el){
  try{ const r=el.getBoundingClientRect(); return r.width>2 && r.height>2; }
  catch(e){ return false; }
}
function _resizeFig(fig){
  fig.querySelectorAll('.plotly-graph-div').forEach(d=>{ try{ Plotly.Plots.resize(d); }catch(e){} });
}
// Run a figure's inert <script>s (re-creating them so they actually execute),
// which calls Plotly.newPlot into the now-visible, real-width <div>. Idempotent:
// a figure is rendered at most once, then only resized.
function renderPlotlyFigure(fig){
  if(!fig || typeof Plotly==='undefined') return;
  if(fig.dataset.plRendered){ _resizeFig(fig); return; }
  if(!_isLaidOut(fig)) return;               // not visible yet — wait for a later trigger
  fig.dataset.plRendered='1';
  fig.querySelectorAll('script').forEach(old=>{
    try{
      const s=document.createElement('script');
      if(old.src) s.src=old.src; else s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    }catch(e){}
  });
  // one post-layout resize so the plot fills its container exactly
  try{ requestAnimationFrame(()=>_resizeFig(fig)); }catch(e){ _resizeFig(fig); }
}
function setupLazyPlotly(){
  if(typeof Plotly==='undefined') return;    // no shared bundle → leave figures inert
  const figs=[...document.querySelectorAll('figure.embedded-plotly')];
  if(!figs.length) return;
  // Sweep every figure: render the visible-and-unrendered ones, resize the rest.
  // This is the reliable path for a subnav-tab click / card expand / expand-all —
  // ANY reveal that changes layout — independent of scrolling.
  const sweep=()=>{ figs.forEach(f=>{ if(_isLaidOut(f)) renderPlotlyFigure(f); }); };
  // Primary: IntersectionObserver renders a figure as it scrolls into view (or
  // becomes visible when its card expands). rootMargin pre-renders slightly early.
  try{
    const io=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ renderPlotlyFigure(en.target);
        if(en.target.dataset.plRendered) io.unobserve(en.target); } });
    }, {root:null, rootMargin:'250px 0px', threshold:0.01});
    figs.forEach(f=>io.observe(f));
  }catch(e){}
  // Belt-and-suspenders for Safari file:// timing: any card class flip (collapse/
  // expand, subnav tab, expand-all) → sweep on the next frame.
  try{
    const mo=new MutationObserver(ms=>{ if(ms.some(m=>m.attributeName==='class')){
      try{ requestAnimationFrame(sweep); }catch(e){ sweep(); } } });
    document.querySelectorAll('.card').forEach(c=>mo.observe(c,{attributes:true,attributeFilter:['class']}));
  }catch(e){}
  // Subnav tab / index click expands + scrolls its target card; sweep just after.
  document.addEventListener('click', e=>{ try{ if(e.target.closest('.subnav a')||e.target.id==='expandall'){
    setTimeout(sweep,60); setTimeout(sweep,220); } }catch(err){} }, true);
  // Keep already-drawn figures crisp on viewport resize.
  window.addEventListener('resize', ()=>{ figs.forEach(f=>{ if(f.dataset.plRendered) _resizeFig(f); }); });
  // Anchored deep-link (opening the report at #s-<slug>): render after layout.
  try{ setTimeout(sweep,120); }catch(e){}
}

/* ---------- interactive loom: hover / tooltip / expand / pan-zoom ---------- */
function _iloomHi(id,kind,name){
  const root=document.getElementById(id); if(!root) return;
  root.classList.add('il-active');
  root.querySelectorAll('.il-edge').forEach(e=>{
    const on = kind==='proc' ? e.getAttribute('data-p')===name : e.getAttribute('data-c')===name;
    e.classList.toggle('on',on); e.classList.toggle('off',!on);
  });
  const conn=new Set();
  root.querySelectorAll('.il-edge.on').forEach(e=>{ conn.add('p:'+e.getAttribute('data-p')); conn.add('c:'+e.getAttribute('data-c')); });
  root.querySelectorAll('.il-proc').forEach(g=>g.classList.toggle('dim', !conn.has('p:'+g.getAttribute('data-proc')) && !(kind==='proc'&&g.getAttribute('data-proc')===name)));
  root.querySelectorAll('.il-comp').forEach(g=>g.classList.toggle('dim', !conn.has('c:'+g.getAttribute('data-comp')) && !(kind==='comp'&&g.getAttribute('data-comp')===name)));
}
function _iloomClear(id){ const r=document.getElementById(id); if(!r) return;
  r.classList.remove('il-active');
  r.querySelectorAll('.on,.off,.dim').forEach(e=>e.classList.remove('on','off','dim'));
  const t=r.querySelector('.il-tip'); if(t) t.hidden=true; }
function _iloomTip(evt,id,text){ const r=document.getElementById(id); if(!r) return;
  const t=r.querySelector('.il-tip'); if(!t) return;
  t.textContent=text; t.hidden=false;
  const b=r.getBoundingClientRect();
  t.style.left=Math.min(b.width-12, evt.clientX-b.left+12)+'px';
  t.style.top=Math.max(4, evt.clientY-b.top-10)+'px'; }
function _iloomExpand(id,comp){ const r=document.getElementById(id); if(!r) return;
  let leaves={}; try{ leaves=JSON.parse(r.getAttribute('data-leaves')||'{}'); }catch(e){}
  let panel=r.querySelector('.il-stores');
  if(!panel){ panel=document.createElement('div'); panel.className='il-stores'; r.appendChild(panel); }
  const list=(leaves[comp]||[]);
  if(panel.dataset.comp===comp && !panel.hidden){ panel.hidden=true; panel.dataset.comp=''; return; }
  panel.dataset.comp=comp; panel.hidden=false;
  panel.innerHTML=`<b>cell/${comp}</b> — ${list.length} store${list.length==1?'':'s'}<div class="il-leaves">`+
    list.map(s=>`<span class="il-leaf">${esc(s)}</span>`).join('')+`</div>`;
}
function setupInteractiveLooms(){
  document.querySelectorAll('.iloom').forEach(root=>{
    const svg=root.querySelector('svg'), view=root.querySelector('.il-view'); if(!svg||!view) return;
    let z=1, tx=0, ty=0, drag=false, sx=0, sy=0;
    const apply=()=>view.setAttribute('transform',`translate(${tx},${ty}) scale(${z})`);
    svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const f=ev.deltaY<0?1.12:1/1.12;
      z=Math.max(0.3,Math.min(6,z*f)); apply(); },{passive:false});
    svg.addEventListener('mousedown',ev=>{ if(ev.target.closest('.il-comp'))return; drag=true; sx=ev.clientX-tx; sy=ev.clientY-ty; svg.classList.add('grabbing'); });
    window.addEventListener('mousemove',ev=>{ if(!drag)return; tx=ev.clientX-sx; ty=ev.clientY-sy; apply(); });
    window.addEventListener('mouseup',()=>{ drag=false; svg.classList.remove('grabbing'); });
  });
}
// Mount the embedded REAL loom(s) lazily (only one study section is visible at a
// time, so we don't boot React/ReactFlow for every study up front). The loom
// posts {type:'explore:ready'} once it mounts; if none arrives (a standalone
// download with no sibling loom bundle), swap in the static-topology fallback.
function setupRealLooms(){
  const frames=[...document.querySelectorAll('.loom-real')];
  if(!frames.length) return;
  const booted=new WeakSet();
  window.addEventListener('message',ev=>{
    const d=ev.data; if(!d||d.type!=='explore:ready') return;
    frames.forEach(f=>{ const ifr=f.querySelector('iframe');
      if(ifr&&ifr.contentWindow===ev.source){ booted.add(f); const b=f.querySelector('.loom-real-boot'); if(b) b.remove(); } });
  });
  const mount=f=>{
    if(f._mounted) return; f._mounted=true;
    const slot=f.querySelector('.loom-real-slot'), src=f.getAttribute('data-loomsrc'); if(!slot||!src) return;
    const ifr=document.createElement('iframe'); ifr.title='bigraph-loom'; ifr.setAttribute('loading','lazy'); ifr.src=src;
    slot.appendChild(ifr);
    setTimeout(()=>{ if(!booted.has(f)){ slot.hidden=true; const fb=f.querySelector('.loom-real-fallback'); if(fb) fb.hidden=false; } }, 8000);
  };
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){ mount(e.target); io.unobserve(e.target); } });},{rootMargin:'250px'});
    frames.forEach(f=>io.observe(f));
  } else { frames.forEach(mount); }
}

/* ---------- one contiguous document ---------- */
function render(inv){
  CUR=inv.slug; loadFB();
  document.getElementById('app').innerHTML=
    `<div class="wrap"><div class="masthead" id="top">
      <div class="eyebrow mono">${esc(inv.slug)} · investigation report</div>
      <h1>${esc(inv.title)}</h1>
      <div class="provline"><span>${inv.studies.length} studies</span><span class="sep">·</span>
        <span>generated 2026-08-18</span><span class="sep">·</span><span class="mono">viva-casebook</span></div>
    </div>${renderExec(inv)}${renderInvViz(inv)}${renderSpine(inv)}</div>`+
    toc(inv)+
    `<div class="wrap">
      <div class="sec-h"><h2>Studies</h2><span class="rule"></span>
        <div class="studies-toolbar"><button id="expandall">Expand all</button><button id="collapseall">Collapse all</button></div></div>
      <p style="color:var(--ink-2);font-size:14px;max-width:none;margin:0 0 8px">Each study is collapsed to a high-level overview — click a study (or a number in the index) to expand its Model, simulation run, visualizations, tests, and decision.</p>
      ${inv.studies.map((s,i)=>renderStudy(s,inv,i+1)).join('')}
      ${renderAppendix(inv)}
      <div class="sec-h" id="report-feedback"><h2>Report feedback</h2><span class="rule"></span></div>
      <p style="color:var(--ink-2);font-size:14px;max-width:none">Leave an overall note, and per-study notes above. Then <b>Review &amp; export</b> assembles them into a YAML feedback report.</p>
      ${feedbackRow('overall','the whole report')}
    </div>`;
  updateCount(); window.scrollTo(0,0); spy();
  setupLazyPlotly();
  setupInteractiveLooms();
  setupRealLooms();
}

/* ---------- wiring ---------- */
document.getElementById('foot-prov').textContent=(INV.provenance||'investigations/'+INV.slug+'/investigation.yaml · studies/*/study.yaml · loop-trajectory JSON');
document.getElementById('wsname').textContent=(INV.workspace||'');
document.getElementById('themebtn').onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dark?'light':'dark');};
// feedback delegation (bound once; #app persists)
const app=document.getElementById('app');
app.addEventListener('input',e=>{ if(e.target.classList.contains('fbnote')){
  const key=e.target.closest('.fbrow').dataset.fbkey; setFB(key,{note:e.target.value}); markBubble(key); }});
function toggleEditor(bub){
  const key=bub.dataset.fb, label=bub.dataset.fblabel, sec=bub.closest('.fbsection');
  let ed=sec.querySelector(':scope > .fbeditor-wrap');
  if(ed){ ed.remove(); return; }
  ed=document.createElement('div'); ed.className='fbeditor-wrap'; ed.innerHTML=feedbackRow(key,label);
  sec.appendChild(ed); const inp=ed.querySelector('input.fbnote'); if(inp) inp.focus();
}
app.addEventListener('click',e=>{
  // per-section feedback bubble → toggle inline editor
  const bub=e.target.closest('.fbbubble');
  if(bub){ e.stopPropagation(); toggleEditor(bub); return; }
  // feedback disposition
  const btn=e.target.closest('.fbdisp button');
  if(btn){ const row=btn.closest('.fbrow'), key=row.dataset.fbkey, disp=btn.dataset.disp;
    const cur=(FB[key]||{}).disp; setFB(key,{disp:cur===disp?null:disp}); markBubble(key);
    row.querySelectorAll('.fbdisp button').forEach(x=>x.classList.remove('on-ok','on-rev'));
    const nd=(FB[key]||{}).disp;
    if(nd==='ok') row.querySelector('[data-disp=ok]').classList.add('on-ok');
    if(nd==='revise') row.querySelector('[data-disp=revise]').classList.add('on-rev'); return; }
  // expand/collapse all
  if(e.target.id==='expandall'){ document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed')); return; }
  if(e.target.id==='collapseall'){ document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed')); return; }
  // index link → expand the target study before scrolling to it
  const link=e.target.closest('.subnav a');
  if(link){ const href=link.getAttribute('href')||''; if(href.startsWith('#s-')){ const c=document.getElementById(href.slice(1)); if(c) c.classList.remove('collapsed'); } return; }
  // a collapsed card is clickable anywhere to expand (ignore real controls/links)
  const anyCard=e.target.closest('.card');
  if(anyCard && anyCard.classList.contains('collapsed') && !e.target.closest('a,button,summary,input,textarea,select')){
    anyCard.classList.remove('collapsed'); return; }
  // header → collapse an expanded study
  const head=e.target.closest('.card-h');
  if(head){ head.closest('.card').classList.toggle('collapsed'); }
});
// modal
const modalbg=document.getElementById('modalbg');
// "Review & export" downloads the YAML feedback report straight to the downloads
// folder (no modal). A Blob + transient <a download> — works in the served page.
document.getElementById('fbfloat').onclick=()=>{
  const yaml=genYaml(INV);
  const blob=new Blob([yaml],{type:'application/x-yaml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='feedback-'+(INV.slug||'investigation')+'.yaml';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const btn=document.getElementById('fbfloat');
  const prev=btn.innerHTML; btn.innerHTML='Downloaded ✓';
  setTimeout(()=>{btn.innerHTML=prev;},1600);
};
document.getElementById('fbclose').onclick=()=>modalbg.classList.remove('open');
modalbg.onclick=e=>{ if(e.target===modalbg) modalbg.classList.remove('open'); };
document.getElementById('fbcopy').onclick=()=>{ const ta=document.getElementById('fbyaml'); ta.select();
  try{ navigator.clipboard.writeText(ta.value); }catch(e){ document.execCommand&&document.execCommand('copy'); }
  document.getElementById('fbcopy').textContent='Copied ✓'; setTimeout(()=>document.getElementById('fbcopy').textContent='Copy YAML',1500); };
render(INV);
</script>
